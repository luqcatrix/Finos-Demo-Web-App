                      </div>
                      <div class="bar-bg"><div class="bar-fill" style="width:${st.pct}%; background:${st.barColor};"></div></div>
                      <div style="display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted);">
                        <span>Terpakai: ${rp(spent)}</span><span>Batas Pos: ${rp(item.limit)}</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </section>
        ` : '';

        container.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <b style="font-size:15px;">Budgeting</b>
              <span style="display:block; font-size:11px; color:var(--muted);">Atur zona aktif melalui ikon ⚙️ di pojok kanan atas</span>
            </div>
            <div style="display:flex; gap:6px; align-items:center;">
              ${pKey === 'custom' && (showZoneA || showZoneB) ? `<button class="btn-secondary" style="padding:5px 9px; font-size:10.5px;" data-action="open-custom-period-modal">📅 Rentang</button>` : ''}
              <button class="btn-secondary" style="padding:5px 9px; font-size:10.5px;" data-action="open-settings">⚙️ Zona</button>
            </div>
          </div>

          ${(showZoneA || showZoneB) ? `
            <div class="seg-tabs">
              ${[['daily','Hari'],['weekly','Pekan'],['monthly','Bulan'],['yearly','Tahun'],['custom','Periode']].map(([k, lbl]) =>
                `<button class="seg-btn ${pKey === k ? 'active' : ''}" data-action="switch-budget-period" data-period="${k}">${lbl}</button>`
              ).join('')}
            </div>
          ` : ''}

          ${zoneAHtml}
          ${zoneBHtml}

          ${(!showZoneA && !showZoneB) ? `
            <div class="card" style="text-align:center; padding:28px 16px;">
              <p style="font-size:13px; font-weight:700; margin-bottom:6px;">Semua Zona Budgeting Sedang Nonaktif</p>
              <p style="font-size:11px; color:var(--muted); line-height:1.45; margin-bottom:14px;">
                Kamu menonaktifkan <b>Zona A (Tabungan & Investasi)</b> dan <b>Zona B (Pos Pengeluaran)</b>. Aktifkan kembali salah satu atau keduanya sesuai kebutuhanmu.
              </p>
              <button class="btn-primary" data-action="open-settings">⚙️ Buka Pengaturan Zona</button>
            </div>
          ` : ''}
        `;
      }

      // 4. TAB CATATAN KEUANGAN
      if (activeTab === 'notes') {
        const openNotes = state.notes.filter(n => !n.isDone);
        const totalOpenNominal = openNotes.reduce((s, n) => s + (n.amount || 0), 0);

        container.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <b style="font-size:15px;">Catatan Keuangan</b>
              <span style="display:block; font-size:11px; color:var(--muted);">Hutang, wishlist, paylater & daftar belanja terintegrasi</span>
            </div>
            <button class="btn-primary" style="padding:7px 11px; font-size:11px;" data-action="open-note-cluster-modal">+ Kluster</button>
          </div>

          <div class="card hero" style="padding:14px;">
            <span class="label-xs">Total Nominal Catatan Belum Selesai</span>
            <div style="font-size:22px; font-weight:800; margin:4px 0 10px;">${rp(totalOpenNominal)}</div>
            <div class="grid-3">
              <div><span style="color:var(--muted)">Kluster</span><b>${state.noteClusters.length}</b></div>
              <div><span style="color:var(--muted)">Belum Selesai</span><b style="color:var(--text-amber)">${openNotes.length} item</b></div>
              <div style="text-align:right;"><span style="color:var(--muted)">Selesai</span><b style="color:var(--text-green)">${state.notes.length - openNotes.length} item</b></div>
            </div>
          </div>

          <div class="seg-tabs">
            ${[['ALL','Semua'],['OPEN','Belum Selesai'],['DONE','Selesai']].map(([k, lbl]) =>
              `<button class="seg-btn ${notesStatusFilter === k ? 'active' : ''}" data-action="notes-status-filter" data-val="${k}">${lbl}</button>`
            ).join('')}
          </div>

          ${state.noteClusters.length === 0 ? `
            <div class="card" style="text-align:center; padding:26px 16px;">
              <p style="font-size:13px; font-weight:700; margin-bottom:6px;">Belum Ada Kluster Catatan</p>
              <p style="font-size:11px; color:var(--muted); line-height:1.45; margin-bottom:14px;">
                Buat klustermu sendiri dengan nama bebas—bisa berdiri sendiri sebagai catatan biasa, atau <b>dihubungkan ke dompet</b> agar saat dicentang otomatis memotong/menambah saldo.
              </p>
              <button class="btn-primary" data-action="open-note-cluster-modal">+ Buat Kluster Pertama</button>
            </div>
          ` : state.noteClusters.map(cl => {
            const allClusterNotes = state.notes.filter(n => n.clusterId === cl.id);
            const openClusterNominal = allClusterNotes.filter(n => !n.isDone).reduce((s, n) => s + (n.amount || 0), 0);
            const visibleNotes = allClusterNotes.filter(n => {
              if (notesStatusFilter === 'OPEN') return !n.isDone;
              if (notesStatusFilter === 'DONE') return n.isDone;
              return true;
            });

            const linkedWallet = cl.linkedWalletId ? state.wallets.find(w => w.id === cl.linkedWalletId) : null;
            const isIncLink = cl.linkedTxType === 'income';

            return `
              <div class="cluster-box">
                <div class="cluster-head">
                  <div style="min-width:0;">
                    <div>
                      <span class="cluster-title">${esc(cl.name)}</span>
                      <span class="cluster-sub">${rp(openClusterNominal)}</span>
                    </div>
                    ${linkedWallet ? `
                      <span class="wallet-link-badge ${isIncLink ? 'link-inc' : 'link-exp'}">
                        🔗 ${esc(linkedWallet.name)} • ${isIncLink ? 'Otomatis Masuk' : 'Otomatis Keluar'}
                      </span>
                    ` : `
                      <span class="wallet-link-badge link-none">📋 Catatan Mandiri (Non-Dompet)</span>
                    `}
                  </div>
                  <div style="display:flex; align-items:center; gap:3px; flex-shrink:0;">
                    <button class="btn-secondary" style="padding:4px 8px; font-size:10.5px;" data-action="open-add-note" data-cid="${cl.id}">+ Catatan</button>
                    <button class="act-icon" title="Edit kluster & integrasi dompet" data-action="open-note-cluster-modal" data-cid="${cl.id}">✎</button>
                    <button class="act-icon del" title="Hapus kluster" data-action="delete-note-cluster" data-cid="${cl.id}">🗑</button>
                  </div>
                </div>

                ${visibleNotes.length === 0 ? `
                  <div class="empty-hint">
                    ${allClusterNotes.length === 0
                      ? `Belum ada item di kluster <b>${esc(cl.name)}</b>. Klik <b>+ Catatan</b> untuk menambahkan.`
                      : 'Tidak ada item pada filter status ini.'}
                  </div>
                ` : `
                  <div style="display:flex; flex-direction:column; gap:7px;">
                    ${visibleNotes.map(n => {
                      const dueInfo = getDueBadgeInfo(n.dueDate, n.isDone);
                      const hasLinkedTx = Boolean(n.linkedTxId && state.transactions.some(t => t.id === n.linkedTxId));
                      return `
                        <div class="note-item ${n.isDone ? 'done' : ''}">
                          <button class="note-check ${n.isDone ? 'checked' : ''}" data-action="toggle-note-done" data-nid="${n.id}" title="${linkedWallet ? 'Centang untuk catat otomatis ke ' + esc(linkedWallet.name) : 'Tandai selesai/belum'}">
                            ${n.isDone ? '✓' : ''}
                          </button>
                          <div style="flex:1; min-width:0;">
                            <div class="note-title">${esc(n.title)}</div>
                            ${n.memo ? `<div style="font-size:11px; color:var(--muted); margin-top:2px;">${esc(n.memo)}</div>` : ''}
                            <div style="display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin-top:4px;">
                              ${n.amount > 0 ? `<b style="font-size:11.5px; color:${n.isDone ? 'var(--muted)' : 'var(--text-green)'};">${rp(n.amount)}</b>` : ''}
                              ${dueInfo ? `<span class="note-due ${dueInfo.cls}">${dueInfo.label}</span>` : ''}
                              ${hasLinkedTx ? `<span class="tx-synced-tag">✓ Tercatat di Dompet</span>` : ''}
                            </div>
                          </div>
                          <div style="display:flex; align-items:center; gap:1px; flex-shrink:0;">
                            ${!linkedWallet && n.amount > 0 && !n.isDone ? `<button class="act-icon" title="Bayar / catat ke dompet" data-action="realize-note" data-nid="${n.id}">💸</button>` : ''}
                            <button class="act-icon" title="Edit catatan" data-action="edit-note" data-nid="${n.id}">✎</button>
                            <button class="act-icon del" title="Hapus catatan" data-action="delete-note" data-nid="${n.id}">🗑</button>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                `}
              </div>
            `;
          }).join('')}
        `;
      }
    }

    // MODAL ZONA A: TAMBAH / EDIT KANTONG TABUNGAN & INVESTASI
    function openSavingsGoalModal(editGoalId = null) {
      const existing = editGoalId ? state.savingsGoals.find(g => g.id === editGoalId) : null;
      const box = document.getElementById('modal-generic-box');

      const sortedWallets = [...state.wallets].sort((a, b) => (a.category === 'invest' ? -1 : 1) - (b.category === 'invest' ? -1 : 1));
      let mode = existing ? existing.mode : 'GOAL_LOCKED';
      let selectedWalletId = existing ? existing.walletId : (sortedWallets[0]?.id || '');

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b style="font-size:14px;">${existing ? '✎ Edit Kantong Tabungan' : '+ Kantong Tabungan / Investasi'}</b>
          <button class="act-icon" data-action="close-modals">✕</button>
        </div>

        <div>
          <span class="label-xs">1. Nama Kantong / Tujuan</span>
          <input id="sg-name-inp" type="text" value="${existing ? esc(existing.name) : ''}" placeholder="Contoh: Bibit Reksadana, Rakit PC, Dana Darurat..." style="margin-top:4px;" />
          ${!existing ? `
            <div class="suggest-chips">
              ${['Bibit Reksadana', 'Dana Darurat', 'Tabungan Beli Barang', 'Tabungan Semester'].map(s =>
                `<button type="button" class="suggest-chip" data-fill-sg="${s}">+ ${s}</button>`
              ).join('')}
            </div>
          ` : ''}
        </div>

        <div>
          <span class="label-xs">2. Mode Tabungan</span>
          <div class="mode-cards">
            <button type="button" id="sg-mode-locked" class="mode-card">
              <span class="mode-card-title">🔒 Target Terkunci</span>
              <span class="mode-card-desc">Ada target nominal untuk beli sesuatu; terkunci s/d 100%.</span>
            </button>
            <button type="button" id="sg-mode-open" class="mode-card">
              <span class="mode-card-title">♾️ Akumulasi Bebas</span>
              <span class="mode-card-desc">Tanpa batas akhir; cocok untuk investasi rutin (Bibit).</span>
            </button>
          </div>
        </div>

        <div id="sg-target-wrap">
          <span class="label-xs">3. Nominal Target Pembelian (Rp)</span>
          <input id="sg-target-inp" type="number" min="1" value="${existing && existing.targetAmount ? existing.targetAmount : ''}" placeholder="Contoh: 2500000" style="margin-top:4px; font-weight:700;" />
        </div>

        <div>
          <span class="label-xs">4. Dompet Penampung Aset</span>
          <div id="sg-wallet-picker" style="margin-top:6px;"></div>
        </div>

        <div>
          <span class="label-xs">Catatan (Opsional)</span>
          <input id="sg-note-inp" type="text" value="${existing ? esc(existing.note || '') : ''}" placeholder="Misal: Setor rutin tiap dikasih uang bulanan..." style="margin-top:4px;" />
        </div>

        <div style="display:flex; gap:8px;">
          <button type="button" class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
          <button type="button" id="save-sg-btn" class="btn-primary" style="flex:1;">Simpan Kantong</button>
        </div>
      `;

      const btnLocked = document.getElementById('sg-mode-locked');
      const btnOpen = document.getElementById('sg-mode-open');
      const targetWrap = document.getElementById('sg-target-wrap');
      const walletPicker = document.getElementById('sg-wallet-picker');

      function refreshGoalModalUI() {
        btnLocked.className = 'mode-card' + (mode === 'GOAL_LOCKED' ? ' active-link' : '');
        btnOpen.className = 'mode-card' + (mode === 'OPEN_SAVING' ? ' active-stand' : '');
        targetWrap.style.display = mode === 'GOAL_LOCKED' ? 'block' : 'none';

        const currentWallets = [...state.wallets].sort((a, b) => (a.category === 'invest' ? -1 : 1) - (b.category === 'invest' ? -1 : 1));
        if (currentWallets.length > 0 && !currentWallets.some(w => w.id === selectedWalletId)) {
          selectedWalletId = currentWallets[0].id;
        }

        walletPicker.innerHTML = `
          ${currentWallets.length > 0 ? `
            <div class="wallet-pick-grid" style="margin-bottom:8px;">
              ${currentWallets.map(w => `
                <button type="button" class="wallet-pick-btn ${selectedWalletId === w.id ? 'selected' : ''}" data-sg-wid="${w.id}">
                  <span class="wallet-pick-name">${selectedWalletId === w.id ? '✓ ' : ''}${esc(w.name)}</span>
                  <span class="wallet-pick-bal">${rp(w.balance)} • ${w.category === 'invest' ? 'Investasi' : w.category.toUpperCase()}</span>
                </button>
              `).join('')}
            </div>
          ` : ''}
          <div style="background:var(--bg); border:1px dashed var(--border-dashed); border-radius:11px; padding:9px;">
            <span style="display:block; font-size:10px; color:var(--text-blue); font-weight:700; margin-bottom:6px;">+ Buat Dompet Investasi / Tabungan Baru:</span>
            <div style="display:grid; grid-template-columns:1.2fr 1fr auto; gap:5px;">
              <input id="sg-new-wname" type="text" placeholder="Mis. Bibit / Celengan" style="padding:6px 8px; font-size:11px;" />
              <input id="sg-new-wbal" type="number" placeholder="Saldo awal" style="padding:6px 8px; font-size:11px;" />
              <button type="button" id="sg-create-wbtn" class="btn-blue" style="padding:6px 9px;">+ Buat</button>
            </div>
          </div>
        `;

        walletPicker.querySelectorAll('[data-sg-wid]').forEach(b => {
          b.onclick = () => {
            selectedWalletId = b.dataset.sgWid;
            refreshGoalModalUI();
          };
        });

        const createWBtn = document.getElementById('sg-create-wbtn');
        if (createWBtn) {
          createWBtn.onclick = () => {
            const wName = document.getElementById('sg-new-wname').value.trim();
            const wBal = parseInt(document.getElementById('sg-new-wbal').value, 10) || 0;
            if (!wName) return showToast('Isi nama dompet investasi terlebih dahulu');
            const newId = 'w_' + Date.now();
            state.wallets.push({ id: newId, name: wName, category: 'invest', balance: wBal });
            selectedWalletId = newId;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            refreshGoalModalUI();
            showToast(`Dompet "${wName}" ditambahkan ke kluster Investasi`);
          };
        }
      }

      btnLocked.onclick = () => { mode = 'GOAL_LOCKED'; refreshGoalModalUI(); };
      btnOpen.onclick = () => { mode = 'OPEN_SAVING'; refreshGoalModalUI(); };
      box.querySelectorAll('[data-fill-sg]').forEach(chip => {
        chip.onclick = () => {
          const inp = document.getElementById('sg-name-inp');
          if (inp) inp.value = chip.dataset.fillSg;
        };
      });

      refreshGoalModalUI();
      document.getElementById('modal-generic').classList.add('open');

      document.getElementById('save-sg-btn').onclick = () => {
        const name = document.getElementById('sg-name-inp').value.trim();
        const targetAmt = parseInt(document.getElementById('sg-target-inp').value, 10) || 0;
        const note = document.getElementById('sg-note-inp').value.trim();

        if (!name) return showToast('Nama kantong tabungan wajib diisi');
        if (mode === 'GOAL_LOCKED' && targetAmt <= 0) return showToast('Masukkan nominal target yang valid');
        if (!selectedWalletId) return showToast('Pilih atau buat dompet penampung terlebih dahulu');

        PERIOD_KEYS.forEach(pk => {
          state.budgetsByPeriod[pk].includedWalletIds = state.budgetsByPeriod[pk].includedWalletIds.filter(id => id !== selectedWalletId);
        });

        if (existing) {
          existing.name = name;
          existing.mode = mode;
          existing.targetAmount = mode === 'GOAL_LOCKED' ? targetAmt : null;
          existing.walletId = selectedWalletId;
          existing.note = note;
        } else {
          state.savingsGoals.push({
            id: 'sg_' + Date.now(),
            name,
            mode,
            targetAmount: mode === 'GOAL_LOCKED' ? targetAmt : null,
            walletId: selectedWalletId,
            isCompleted: false,
            note
          });
        }
        document.getElementById('modal-generic').classList.remove('open');
        saveState();
        showToast(existing ? 'Kantong tabungan diperbarui' : 'Kantong tabungan berhasil dibuat');
      };
    }

    // MODAL REALISASI PEMBELIAN DARI TARGET TERKUNCI
    function openRealizeGoalModal(goalId) {
      const goal = state.savingsGoals.find(g => g.id === goalId);
      if (!goal) return;
      const w = state.wallets.find(x => x.id === goal.walletId);
      if (!w) return showToast('Dompet penampung tidak ditemukan');

      const cats = getExpenseCategories();
      const box = document.getElementById('modal-generic-box');
      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b style="font-size:14px;">🛍️ Realisasi Target: ${esc(goal.name)}</b>
          <button class="act-icon" data-action="close-modals">✕</button>
        </div>
        <p style="font-size:11px; color:var(--muted); line-height:1.45;">
          Dana akan dipotong langsung dari kantong <b>${esc(w.name)}</b> (Saldo: <b>${rp(w.balance)}</b>) sehingga <b>tidak mengganggu jatah budget belanja harianmu</b>.
        </p>
        <div style="display:flex; flex-direction:column; gap:9px;">
          <div>
            <span class="label-xs">Harga Realisasi Pembelian (Rp)</span>
            <input id="rg-amt" type="number" min="1" value="${goal.targetAmount || w.balance}" style="margin-top:4px; font-weight:700;" />
          </div>
          <div>
            <span class="label-xs">Kategori Pencatatan</span>
            <select id="rg-cat" style="margin-top:4px;">
              ${cats.map(c => `<option value="${esc(c)}" ${c === 'Belanja Online' ? 'selected' : ''}>${esc(c)}</option>`).join('')}
            </select>
          </div>
          <div>
            <span class="label-xs">Keterangan Barang</span>
            <input id="rg-note" type="text" value="Realisasi Target: ${esc(goal.name)}" style="margin-top:4px;" />
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
          <button id="exec-rg-btn" class="btn-primary" style="flex:1;">Konfirmasi Beli</button>
        </div>
      `;
      document.getElementById('modal-generic').classList.add('open');

      document.getElementById('exec-rg-btn').onclick = () => {
        const amt = parseInt(document.getElementById('rg-amt').value, 10) || 0;
        const cat = document.getElementById('rg-cat').value;
        const note = document.getElementById('rg-note').value.trim() || `Realisasi: ${goal.name}`;
        if (amt <= 0) return showToast('Nominal pembelian harus valid');

        const finalTitle = cat === 'Lainnya' ? `Lainnya: ${note}` : note;
        const tx = {
          id: 'tx_' + Date.now(),
          walletId: w.id,
          type: 'expense',
          amount: amt,
          title: finalTitle,
          category: cat,
          isAuto: false,
          createdAt: new Date().toISOString()
        };
        applyWalletEffect(tx);
        state.transactions.unshift(tx);
        goal.isCompleted = true;

        document.getElementById('modal-generic').classList.remove('open');
        saveState();
        showToast(`Target "${goal.name}" berhasil direalisasikan!`);
      };
    }

    // MODAL ZONA B: TAMBAH / EDIT POS PENGELUARAN KATEGORI BEBAS
    function openExpensePostModal(editCatName = null) {
      const pKey = state.activeBudgetPeriod;
      const cfg = state.budgetsByPeriod[pKey];
      const existing = editCatName ? cfg.allocations[editCatName] : null;
      const suggestions = getExpenseCategories().filter(c => c !== 'Lainnya');
      const box = document.getElementById('modal-generic-box');

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b style="font-size:14px;">${existing ? '✎ Edit Pos Pengeluaran' : '+ Pos Pengeluaran Bebas'}</b>
          <button class="act-icon" data-action="close-modals">✕</button>
        </div>

        <div>
          <span class="label-xs">Nama Kategori Pos (Bebas Tulis Sendiri)</span>
          <input id="ep-cat-inp" type="text" value="${editCatName ? esc(editCatName) : ''}" placeholder="Misal: Makan Harian, Ngopi, Bensin, Kuota..." style="margin-top:4px;" />
          ${!existing ? `
            <div class="suggest-chips">
              ${suggestions.map(s => `<button type="button" class="suggest-chip" data-fill-ep="${esc(s)}">${esc(s)}</button>`).join('')}
            </div>
          ` : ''}
        </div>

        <div>
          <span class="label-xs">Batas Anggaran (${getPeriodLabel(pKey, cfg)})</span>
          <input id="ep-limit-inp" type="number" min="1" value="${existing ? existing.limit : ''}" placeholder="Contoh: 500000" style="margin-top:4px; font-weight:700;" />
        </div>

        <div>
          <span class="label-xs">Catatan Penggunaan (Opsional)</span>
          <input id="ep-note-inp" type="text" value="${existing ? esc(existing.note || '') : ''}" placeholder="Dipakai untuk apa pada periode ini..." style="margin-top:4px;" />
        </div>

        <div style="display:flex; gap:8px;">
          <button type="button" class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
          <button type="button" id="save-ep-btn" class="btn-primary" style="flex:1;">Simpan Pos</button>
        </div>
      `;

      box.querySelectorAll('[data-fill-ep]').forEach(chip => {
        chip.onclick = () => {
          const inp = document.getElementById('ep-cat-inp');
          if (inp) inp.value = chip.dataset.fillEp;
        };
      });

      document.getElementById('modal-generic').classList.add('open');
      if (!existing) setTimeout(() => document.getElementById('ep-cat-inp')?.focus(), 50);

      document.getElementById('save-ep-btn').onclick = () => {
        const catName = document.getElementById('ep-cat-inp').value.trim();
        const limit = parseInt(document.getElementById('ep-limit-inp').value, 10) || 0;
        const note = document.getElementById('ep-note-inp').value.trim();

        if (!catName) return showToast('Nama kategori pos wajib diisi');
        if (limit <= 0) return showToast('Masukkan batas nominal anggaran yang valid');

        if (!DEFAULT_EXPENSE_CATS.includes(catName) && !(state.customExpenseCats || []).includes(catName)) {
          state.customExpenseCats.push(catName);
        }

        if (editCatName && editCatName !== catName) {
          delete cfg.allocations[editCatName];
        }
        cfg.allocations[catName] = { limit, note };

        document.getElementById('modal-generic').classList.remove('open');
        saveState();
        showToast(`Pos anggaran "${catName}" disimpan`);
      };
    }

    function openCustomPeriodModal() {

          <button class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>

    function openNoteClusterModal(editClusterId = null) {
      const existing = editClusterId ? state.noteClusters.find(c => c.id === editClusterId) : null;
      const box = document.getElementById('modal-generic-box');

      let mode = (existing && existing.linkedWalletId) ? 'wallet' : 'standalone';
      let selectedWalletId = existing ? (existing.linkedWalletId || (state.wallets[0]?.id || '')) : (state.wallets[0]?.id || '');
      let selectedTxType = existing ? (existing.linkedTxType || 'expense') : 'expense';
      let selectedCat = existing ? (existing.linkedCategory || '') : '';

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b style="font-size:14px;">${existing ? '✎ Pengaturan Kluster' : '+ Buat Kluster Catatan Baru'}</b>
          <button class="act-icon" data-action="close-modals">✕</button>
        </div>

        <div>
          <span class="label-xs">1. Nama Kluster</span>
          <input id="nc-name-inp" type="text" value="${existing ? esc(existing.name) : ''}" placeholder="Contoh: Belanja Rakit PC, Hutang, Paylater..." style="margin-top:4px;" />
          ${!existing ? `
            <div class="suggest-chips">
              ${['Daftar Belanja', 'Hutang & Piutang', 'Wishlist Barang', 'Cicilan Paylater'].map(s =>
                `<button type="button" class="suggest-chip" data-action="fill-nc-name" data-val="${s}">+ ${s}</button>`
              ).join('')}
            </div>
          ` : ''}

        <div>
          <span class="label-xs">2. Mode Hubungan Dompet</span>
          <div class="mode-cards">
            <button type="button" id="mode-btn-standalone" class="mode-card">
              <span class="mode-card-title">📋 Catatan Mandiri</span>
              <span class="mode-card-desc">Hanya daftar catatan biasa, tidak mengubah saldo dompet.</span>
            </button>
            <button type="button" id="mode-btn-wallet" class="mode-card">
              <span class="mode-card-title">🔗 Integrasi Dompet</span>
              <span class="mode-card-desc">Centang item otomatis potong / tambah saldo dompet.</span>
            </button>
          </div>
        </div>

        <div id="nc-integration-panel" style="display:none; background:var(--bg); border:1px solid rgba(56,189,248,0.35); border-radius:14px; padding:11px; flex-direction:column; gap:11px;"></div>

        <div style="display:flex; gap:8px;">
          <button type="button" class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
          <button type="button" id="save-nc-btn" class="btn-primary" style="flex:1;">${existing ? 'Simpan Perubahan' : 'Buat Kluster'}</button>
        </div>
      `;

      const btnStand = document.getElementById('mode-btn-standalone');
      const btnWallet = document.getElementById('mode-btn-wallet');
      const panel = document.getElementById('nc-integration-panel');

      function renderIntegrationPanel() {
        btnStand.className = 'mode-card' + (mode === 'standalone' ? ' active-stand' : '');
        btnWallet.className = 'mode-card' + (mode === 'wallet' ? ' active-link' : '');

        if (mode === 'standalone') {
          panel.style.display = 'none';
          return;
        }

        panel.style.display = 'flex';
        if (state.wallets.length > 0 && !state.wallets.some(w => w.id === selectedWalletId)) {
          selectedWalletId = state.wallets[0].id;
        }

        const catList = selectedTxType === 'income' ? INCOME_CATS : getExpenseCategories();
        if (selectedCat && !catList.includes(selectedCat)) selectedCat = '';

        panel.innerHTML = `
          <div>
            <span class="label-xs" style="color:var(--text-blue);">A. Pilih Dompet Target</span>
            ${state.wallets.length === 0 ? `
              <div style="margin-top:6px; background:var(--surface); border:1px dashed var(--border-dashed); border-radius:11px; padding:10px;">
                <p style="font-size:11px; color:var(--muted); margin-bottom:8px; line-height:1.4;">
                  Kamu belum punya dompet di Beranda. Buat dompet cepat di sini agar kluster bisa langsung dihubungkan:
                </p>
                <div style="display:grid; grid-template-columns:1.2fr 1fr; gap:6px; margin-bottom:6px;">
                  <input id="quick-w-name" type="text" placeholder="Nama (mis. GoPay / BCA)" style="padding:7px 9px; font-size:11px;" />
                  <input id="quick-w-bal" type="number" placeholder="Saldo awal (Rp)" style="padding:7px 9px; font-size:11px;" />
                </div>
                <div style="display:flex; gap:6px;">
                  <select id="quick-w-cat" style="padding:6px 8px; font-size:11px; flex:1;">
                    <option value="ewallet">E-Wallet</option>
                    <option value="bank">Bank</option>
                    <option value="cash">Fisik / Cash</option>
                    <option value="invest">Investasi & Tabungan</option>
                  </select>
                  <button type="button" id="quick-w-create-btn" class="btn-primary" style="padding:6px 10px; font-size:11px;">+ Buat & Pilih</button>
                </div>
              </div>
            ` : `
              <div class="wallet-pick-grid">
                ${state.wallets.map(w => `
                  <button type="button" class="wallet-pick-btn ${selectedWalletId === w.id ? 'selected' : ''}" data-pick-wid="${w.id}">
                    <span class="wallet-pick-name">${selectedWalletId === w.id ? '✓ ' : ''}${esc(w.name)}</span>
                    <span class="wallet-pick-bal">${rp(w.balance)}</span>
                  </button>
                `).join('')}
              </div>
            `}
          </div>

          <div>
            <span class="label-xs" style="color:var(--text-blue);">B. Efek Saat Item Dicentang</span>
            <div class="flow-toggle-grid">
              <button type="button" id="flow-exp-btn" class="flow-toggle-btn ${selectedTxType === 'expense' ? 'active-exp' : ''}">
                📤 Pengeluaran (- Saldo)
              </button>
              <button type="button" id="flow-inc-btn" class="flow-toggle-btn ${selectedTxType === 'income' ? 'active-inc' : ''}">
                📥 Pemasukan (+ Saldo)
              </button>
            </div>
          </div>

          <div>
            <span class="label-xs" style="color:var(--text-blue);">C. Kategori Transaksi</span>
            <div class="mini-chip-wrap">
              <button type="button" class="mini-chip ${selectedCat === '' ? 'selected' : ''}" data-pick-nc-cat="">✨ Otomatis</button>
              ${catList.map(c => `
                <button type="button" class="mini-chip ${selectedCat === c ? 'selected' : ''}" data-pick-nc-cat="${esc(c)}">${esc(c)}</button>
              `).join('')}
            </div>
          </div>
        `;

        const qwBtn = document.getElementById('quick-w-create-btn');
        if (qwBtn) {
          qwBtn.onclick = () => {
            const wName = document.getElementById('quick-w-name').value.trim();
            const wBal = parseInt(document.getElementById('quick-w-bal').value, 10) || 0;
            const wCat = document.getElementById('quick-w-cat').value;
            if (!wName) return showToast('Isi nama dompet terlebih dahulu');
            const newId = 'w_' + Date.now();
            state.wallets.push({ id: newId, name: wName, category: wCat, balance: wBal });
            if (wCat !== 'invest') {
              PERIOD_KEYS.forEach(pk => {
                if (!state.budgetsByPeriod[pk].includedWalletIds.includes(newId)) {
                  state.budgetsByPeriod[pk].includedWalletIds.push(newId);
                }
              });
            }
            selectedWalletId = newId;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            renderIntegrationPanel();
            showToast(`Dompet "${wName}" dibuat & terhubung`);
          };
        }

        panel.querySelectorAll('[data-pick-wid]').forEach(btn => {
          btn.onclick = () => {
            selectedWalletId = btn.dataset.pickWid;
            renderIntegrationPanel();
          };
        });

        const expBtn = document.getElementById('flow-exp-btn');
        const incBtn = document.getElementById('flow-inc-btn');
        if (expBtn) expBtn.onclick = () => { selectedTxType = 'expense'; renderIntegrationPanel(); };
        if (incBtn) incBtn.onclick = () => { selectedTxType = 'income'; renderIntegrationPanel(); };

        panel.querySelectorAll('[data-pick-nc-cat]').forEach(btn => {
          btn.onclick = () => {
            selectedCat = btn.dataset.pickNcCat;
            renderIntegrationPanel();
          };
        });
      }

      btnStand.onclick = () => { mode = 'standalone'; renderIntegrationPanel(); };
      btnWallet.onclick = () => { mode = 'wallet'; renderIntegrationPanel(); };

      renderIntegrationPanel();
      document.getElementById('modal-generic').classList.add('open');
      if (!existing) setTimeout(() => document.getElementById('nc-name-inp')?.focus(), 50);

      document.getElementById('save-nc-btn').onclick = () => {
        const name = document.getElementById('nc-name-inp').value.trim();
        if (!name) return showToast('Nama kluster tidak boleh kosong');

        if (mode === 'wallet' && !selectedWalletId) {
          return showToast('Pilih atau buat dompet terlebih dahulu untuk mode Integrasi Dompet');
        }

        const finalWalletId = mode === 'wallet' ? selectedWalletId : '';
        const finalTxType = mode === 'wallet' ? selectedTxType : 'expense';
        const finalCat = mode === 'wallet' ? selectedCat : '';

        if (existing) {
          existing.name = name;
          existing.linkedWalletId = finalWalletId;
          existing.linkedTxType = finalTxType;
          existing.linkedCategory = finalCat;
          showToast('Pengaturan kluster diperbarui');
        } else {
          state.noteClusters.push({
            id: 'nc_' + Date.now(),
            name,
            linkedWalletId: finalWalletId,
            linkedTxType: finalTxType,
            linkedCategory: finalCat
          });
          showToast(finalWalletId ? `Kluster "${name}" terhubung ke dompet` : `Kluster "${name}" dibuat`);
        }
        document.getElementById('modal-generic').classList.remove('open');
        saveState();
      };
    }

    function openNoteFormModal(clusterId, editNoteId = null) {

      if (!cluster) return;
      const existing = editNoteId ? state.notes.find(n => n.id === editNoteId) : null;
      const linkedWallet = cluster.linkedWalletId ? state.wallets.find(w => w.id === cluster.linkedWalletId) : null;
      const box = document.getElementById('modal-generic-box');

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b style="font-size:14px;">${existing ? '✎ Edit Catatan' : '+ Tambah Catatan'} • ${esc(cluster.name)}</b>
          <button class="act-icon" data-action="close-modals">✕</button>
        </div>
        ${linkedWallet ? `

        <div style="display:flex; flex-direction:column; gap:9px;">

          </div>
          <div>
            <span class="label-xs">Keterangan Tambahan (Opsional)</span>
            <input id="nt-memo" type="text" value="${existing ? esc(existing.memo || '') : ''}" placeholder="Catatan detail, spesifikasi, dll..." style="margin-top:4px;" />
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
          <button id="save-nt-btn" class="btn-primary" style="flex:1;">Simpan Catatan</button>
        </div>
      `;
      document.getElementById('modal-generic').classList.add('open');
      setTimeout(() => document.getElementById('nt-title')?.focus(), 50);

      document.getElementById('save-nt-btn').onclick = () => {
        const title = document.getElementById('nt-title').value.trim();
        const amount = parseInt(document.getElementById('nt-amount').value, 10) || 0;
        const dueDate = document.getElementById('nt-due').value || '';
        const memo = document.getElementById('nt-memo').value.trim();
        if (!title) return showToast('Judul catatan wajib diisi');

        if (existing) {
          existing.title = title;
          existing.amount = amount;
          existing.dueDate = dueDate;
          existing.memo = memo;
        } else {
          state.notes.unshift({
            id: 'nt_' + Date.now(),
            clusterId: cluster.id,
            title,
            amount,
            dueDate,
            memo,
            isDone: false,
            linkedTxId: null,
            createdAt: new Date().toISOString()
          });
        }
        document.getElementById('modal-generic').classList.remove('open');
        saveState();
        showToast(existing ? 'Catatan diperbarui' : 'Catatan ditambahkan');
      };
    }

    function openRealizeNoteModal(noteId) {
      const note = state.notes.find(n => n.id === noteId);
      if (!note) return;
      if (state.wallets.length === 0) {
        return showToast('Tambahkan dompet dulu di Beranda untuk mencatat transaksi');
      }
      const cluster = state.noteClusters.find(c => c.id === note.clusterId);
      const expCats = getExpenseCategories();
      const box = document.getElementById('modal-generic-box');

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b style="font-size:14px;">💸 Realisasikan ke Transaksi</b>
          <button class="act-icon" data-action="close-modals">✕</button>
        </div>
        <p style="font-size:11px; color:var(--muted);">

              ${state.wallets.map(w => `<option value="${w.id}">${esc(w.name)} (${rp(w.balance)})</option>`).join('')}
            </select>
          </div>
          <div>
            <span class="label-xs">Kategori Transaksi</span>
            <select id="rz-cat" style="margin-top:4px;">
              ${expCats.map(c => `<option value="${esc(c)}" ${c === autoCategory(note.title) ? 'selected' : ''}>${esc(c)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
          <button id="exec-rz-btn" class="btn-primary" style="flex:1;">Catat & Selesaikan</button>
        </div>
      `;
      document.getElementById('modal-generic').classList.add('open');

      document.getElementById('rz-type').onchange = (e) => {
        const isInc = e.target.value === 'income';
        const list = isInc ? INCOME_CATS : getExpenseCategories();
        document.getElementById('rz-cat').innerHTML = list.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
      };

      document.getElementById('exec-rz-btn').onclick = () => {
        const txType = document.getElementById('rz-type').value;
        const wId = document.getElementById('rz-wallet').value;
        const cat = document.getElementById('rz-cat').value;
        const prefixCluster = cluster ? `[${cluster.name}] ` : '';
        const finalTitle = cat === 'Lainnya' ? `Lainnya: ${prefixCluster}${note.title}` : `${prefixCluster}${note.title}`;

        const tx = {
          id: 'tx_' + Date.now(),
          walletId: wId,
          type: txType,
          amount: note.amount,
          title: finalTitle,
          category: cat,
          isAuto: false,
          createdAt: new Date().toISOString()
        };
        applyWalletEffect(tx);
        state.transactions.unshift(tx);
        note.isDone = true;
        note.linkedTxId = tx.id;

        document.getElementById('modal-generic').classList.remove('open');
        saveState();
        showToast('Tercatat ke transaksi & catatan ditandai selesai');
      };
    }

    // MODAL EDIT & HAPUS DOMPET (DENGAN KONFIRMASI PENGHAPUSAN)
    function openWalletEditModal(walletId) {
      const w = state.wallets.find(x => x.id === walletId);
      if (!w) return;
      const clusterLabel = w.category === 'bank' ? 'Bank' : w.category === 'ewallet' ? 'E-Wallet' : w.category === 'invest' ? 'Investasi & Tabungan' : 'Fisik / Cash';
      const box = document.getElementById('modal-generic-box');

      function renderWalletEditForm() {
        box.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <b style="font-size:14px;">✎ Edit Akun ${esc(w.name)}</b>
            <button class="act-icon" data-action="close-modals">✕</button>
          </div>
          <p style="font-size:11px; color:var(--muted); line-height:1.4;">
            Saldo saat ini: <b>${rp(w.balance)}</b> (${clusterLabel}). Selisih penyesuaian dicatat sebagai <b>SYNC</b> di Laporan agar tidak mengubah arus kas.
          </p>
          <div>
            <span class="label-xs">Nama Dompet / Akun</span>
            <input id="edit-name-inp" type="text" value="${esc(w.name)}" style="margin-top:4px; margin-bottom:8px;" />
            <span class="label-xs">Saldo Aktual Saat Ini (Rp)</span>
            <input id="edit-bal-inp" type="number" value="${w.balance}" style="margin-top:4px; font-size:16px; font-weight:700;" />
          </div>
          <div style="display:flex; gap:8px;">
            <button class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
            <button id="save-bal-btn" class="btn-primary" style="flex:1;">Sinkronkan</button>
          </div>
          <div style="border-top:1px solid var(--border); padding-top:12px;">
            <button id="ask-del-wallet-btn" class="btn-danger" style="width:100%;">🗑️ Hapus Akun / Dompet Ini</button>
          </div>
        `;

        document.getElementById('save-bal-btn').onclick = () => {
          const nextName = document.getElementById('edit-name-inp').value.trim();
          const nextBal = parseInt(document.getElementById('edit-bal-inp').value, 10);
          if (nextName) w.name = nextName;
          if (!isNaN(nextBal)) {
            const diff = nextBal - w.balance;
            if (diff !== 0) {
              state.transactions.unshift({
                id: 'tx_sync_' + Date.now(),
                walletId: w.id,
                type: 'sync',
                syncDiff: diff,
                amount: Math.abs(diff),
                title: `Penyesuaian Saldo (${w.name})`,
                category: 'Sinkronisasi',
                isAuto: false,
                createdAt: new Date().toISOString()
              });
              w.balance = nextBal;
            }
          }
          document.getElementById('modal-generic').classList.remove('open');
          saveState();
          showToast('Saldo disinkronkan tanpa mengubah arus kas');
        };

        document.getElementById('ask-del-wallet-btn').onclick = () => {
          renderWalletDeleteConfirm();
        };
      }

      function renderWalletDeleteConfirm() {
        const linkedGoal = state.savingsGoals.find(g => g.walletId === w.id);
        box.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <b style="font-size:14px; color:var(--red);">⚠️ Konfirmasi Hapus Dompet</b>
            <button class="act-icon" data-action="close-modals">✕</button>
          </div>

          <div style="background:var(--red-soft); border:1px solid rgba(244,63,94,0.4); border-radius:14px; padding:12px;">
            <div style="font-size:13px; font-weight:800; color:var(--text-red);">${esc(w.name)} <span style="font-size:10.5px; font-weight:600;">(${clusterLabel})</span></div>
            <div style="font-size:16px; font-weight:800; color:var(--text); margin-top:4px;">Saldo tersisa: ${rp(w.balance)}</div>
          </div>

          <p style="font-size:11.5px; color:var(--text-2); line-height:1.45;">
            Apakah kamu yakin ingin menghapus akun <b>${esc(w.name)}</b>?
          </p>
          <ul style="font-size:11px; color:var(--muted); padding-left:16px; line-height:1.45; display:flex; flex-direction:column; gap:4px;">
            <li>Saldo sebesar <b>${rp(w.balance)}</b> pada akun ini akan dihapus dari total kekayaan.</li>
            <li>Riwayat transaksi lama tetap tersimpan sebagai arsip laporan.</li>
            ${linkedGoal ? `<li style="color:var(--text-amber);">Kantong tabungan <b>${esc(linkedGoal.name)}</b> juga akan dilepas dari akun ini.</li>` : ''}
          </ul>

          <div style="display:flex; gap:8px;">
            <button id="back-edit-wallet-btn" class="preset-btn" style="flex:1; padding:10px;">← Kembali</button>
            <button id="confirm-del-wallet-btn" class="btn-danger" style="flex:1; background:var(--red); color:#fff; border:none;">Ya, Hapus Permanen</button>
          </div>
        `;

        document.getElementById('back-edit-wallet-btn').onclick = () => renderWalletEditForm();

        document.getElementById('confirm-del-wallet-btn').onclick = () => {
          const deletedName = w.name;
          state.wallets = state.wallets.filter(item => item.id !== w.id);

          PERIOD_KEYS.forEach(pk => {
            state.budgetsByPeriod[pk].includedWalletIds = state.budgetsByPeriod[pk].includedWalletIds.filter(id => id !== w.id);
          });
          state.noteClusters.forEach(nc => {
            if (nc.linkedWalletId === w.id) nc.linkedWalletId = '';
          });
          state.savingsGoals = state.savingsGoals.filter(g => g.walletId !== w.id);

          document.getElementById('modal-generic').classList.remove('open');
          saveState();
          showToast(`Akun "${deletedName}" berhasil dihapus`);
        };
      }

      renderWalletEditForm();
      document.getElementById('modal-generic').classList.add('open');
    }

          <div class="seg-tabs">
            ${[['dark','🌙 Dark Mode'],['light','☀️ Light Mode'],['system','📱 Sistem']].map(([tKey, tLbl]) =>
              `<button class="seg-btn ${currentTheme === tKey ? 'active' : ''}" data-action="set-theme" data-theme-val="${tKey}">${tLbl}</button>`
            ).join('')}
          </div>
        </div>

        <div style="background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:8px;">
          <div>
            <b style="font-size:12px; color:var(--text-blue);">🎯 Pengaturan Fitur Budgeting</b>
            <p style="font-size:11px; color:var(--muted); margin-top:2px;">Aktifkan atau matikan zona budgeting sesuai kebutuhanmu:</p>
          </div>

          <div class="setting-toggle-row">
            <div style="min-width:0;">
              <b style="font-size:11.5px; display:block;">Zona A: Tabungan & Investasi</b>
              <span style="font-size:10px; color:var(--muted); display:block; line-height:1.3;">Target terkunci & akumulasi aset non-pengeluaran.</span>
            </div>
            <button class="switch-pill ${zoneAOn ? 'on-blue' : ''}" data-action="toggle-budget-zone" data-zone="A">
              ${zoneAOn ? 'ON' : 'OFF'}
            </button>
          </div>

          <div class="setting-toggle-row">
            <div style="min-width:0;">
              <b style="font-size:11.5px; display:block;">Zona B: Pos Pengeluaran Bebas</b>
              <span style="font-size:10px; color:var(--muted); display:block; line-height:1.3;">Pembagian plafon belanja dengan kategori kustom.</span>
            </div>
            <button class="switch-pill ${zoneBOn ? 'on-green' : ''}" data-action="toggle-budget-zone" data-zone="B">
              ${zoneBOn ? 'ON' : 'OFF'}
            </button>
          </div>
        </div>

        <div style="background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:12px;">
          <b style="font-size:12px; color:var(--text-green);">📱 Simulator Notifikasi HP (Uji Logika)</b>
          <p style="font-size:11px; color:var(--muted); margin-top:3px;">Uji pencatatan otomatis & anti-double counting:</p>
          <div class="sim-grid">
            <button class="sim-btn" data-action="sim-notif" data-sim="qris">💳 <b>QRIS GoPay</b><br>Bayar Warung -Rp18.000</button>
            <button class="sim-btn" data-action="sim-notif" data-sim="topup">⇄ <b>Top Up GoPay</b><br>Dari BCA Rp100.000</button>
            <button class="sim-btn" data-action="sim-notif" data-sim="shopee">🛍️ <b>Notif Shopee</b><br>Perkaya judul Rp18.000</button>
            <button class="sim-btn" data-action="sim-notif" data-sim="unparsed">⚠️ <b>Format Asing</b><br>Masuk kotak gagal baca</button>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:8px;">
          <span class="label-xs">Manajemen Data & Preferensi</span>
          <button class="sim-btn" style="text-align:center; font-weight:700;" data-action="toggle-hide">
            ${state.settings.hideBalance ? '👁️ Tampilkan Nominal Saldo' : '🙈 Sembunyikan Nominal Saldo'}
          </button>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <button class="sim-btn" style="text-align:center; font-weight:700; color:var(--text-green);" data-action="export-json">
              ⬇️ Export (.JSON)
            </button>
            <button class="sim-btn" style="text-align:center; font-weight:700; color:var(--text-blue);" data-action="import-json">
              ⬆️ Import (.JSON)
            </button>
          </div>
          <button class="sim-btn" style="text-align:center; color:var(--red);" data-action="reset-empty">
            ↺ Kosongkan Semua Data (Reset ke 0)
          </button>
        </div>
      `;
      document.getElementById('modal-generic').classList.add('open');
    }

    function renderAddModalBody() {
      if (state.wallets.length === 0) {
        document.getElementById('modal-add-body').innerHTML = `
          <div style="text-align:center; padding:20px 10px;">
            <p style="font-size:12px; color:var(--muted); margin-bottom:12px;">Belum ada dompet yang terdaftar. Tambahkan dompet terlebih dahulu di Beranda (klik <b>Mode Edit</b> pada kluster Bank, E-Wallet, Fisik, atau Investasi).</p>
            <button class="btn-primary" data-action="close-modals">Mengerti</button>
          </div>
        `;
        return;
      }

      document.querySelectorAll('[data-tx-tab]').forEach(b => b.classList.toggle('active', b.dataset.txTab === modalTxType));

      const cats = modalTxType === 'income' ? INCOME_CATS : getExpenseCategories();
      if (!cats.includes(selectedCategory)) selectedCategory = cats[0];
      const isOther = selectedCategory === 'Lainnya';
      const body = document.getElementById('modal-add-body');

      const defaultToIdx = preselectTransferToId
        ? Math.max(0, state.wallets.findIndex(w => w.id === preselectTransferToId))
        : (state.wallets.length > 1 ? 1 : 0);
      const defaultFromIdx = defaultToIdx === 0 && state.wallets.length > 1 ? 1 : 0;

      body.innerHTML = `
        <form id="full-tx-form" style="display:flex; flex-direction:column; gap:12px;">
          ${modalTxType === 'transfer' ? `
            <div style="display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; background:var(--bg); border:1px solid var(--border); padding:10px; border-radius:14px;">
              <div><span class="label-xs">Dari</span><select id="tx-from">${state.wallets.map((w, i) => `<option value="${w.id}" ${i === defaultFromIdx ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}</select></div>
              <span style="color:var(--blue); font-weight:800; margin-top:12px;">→</span>
              <div><span class="label-xs">Ke</span><select id="tx-to">${state.wallets.map((w, i) => `<option value="${w.id}" ${i === defaultToIdx ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}</select></div>
            </div>
          ` : `
            <div>
              <span class="label-xs">Pilih Kategori</span>
              <div class="cat-grid" style="margin-top:6px;">
                ${cats.map(c => `<div class="cat-chip ${selectedCategory === c ? 'selected' : ''}" data-action="pick-cat" data-cat="${esc(c)}">${esc(c)}</div>`).join('')}
              </div>
            </div>

            ${isOther ? `
              <div class="other-box">
                <label for="tx-other-detail">⚠️ Keterangan "Lainnya" (Wajib Diisi)</label>
                <input id="tx-other-detail" type="text" required placeholder="Jelaskan transaksi ini untuk apa..." />
              </div>
            ` : ''}

            <div>
              <span class="label-xs">Dompet Sumber</span>
              <select id="tx-wallet" style="margin-top:6px;">${state.wallets.map(w => `<option value="${w.id}">${esc(w.name)} (${w.category.toUpperCase()})</option>`).join('')}</select>
            </div>
          `}
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <div><span class="label-xs">Nominal (Rp)</span><input id="tx-amount" type="number" min="1" required placeholder="15000" style="margin-top:4px; font-weight:700;" /></div>
            <div><span class="label-xs">${isOther && modalTxType !== 'transfer' ? 'Catatan Tambahan' : 'Catatan'}</span><input id="tx-note" type="text" placeholder="Opsional..." style="margin-top:4px;" /></div>
          </div>
          <button type="submit" class="btn-primary" style="width:100%; padding:12px;">Simpan Transaksi</button>
        </form>
      `;

      document.getElementById('full-tx-form').onsubmit = (e) => {
        e.preventDefault();
        const amount = parseInt(document.getElementById('tx-amount').value, 10);
        const note = document.getElementById('tx-note').value.trim();
        if (!amount || amount <= 0) return;

        if (modalTxType === 'transfer') {
          if (state.wallets.length < 2) return showToast('Minimal butuh 2 dompet untuk melakukan transfer');
          const fromId = document.getElementById('tx-from').value;
          const toId = document.getElementById('tx-to').value;
          if (fromId === toId) return showToast('Dompet asal dan tujuan harus berbeda');
          const fW = state.wallets.find(w => w.id === fromId);
          const tW = state.wallets.find(w => w.id === toId);
          const tx = { id: 'tx_' + Date.now(), walletId: fromId, targetWalletId: toId, type: 'transfer', amount, title: note || `Transfer: ${fW.name} → ${tW.name}`, category: 'Transfer', isAuto: false, createdAt: new Date().toISOString() };
          applyWalletEffect(tx);
          state.transactions.unshift(tx);
          preselectTransferToId = null;
        } else {
          let finalTitle = note || selectedCategory;
          if (selectedCategory === 'Lainnya') {
            const otherDetail = document.getElementById('tx-other-detail')?.value.trim();
            if (!otherDetail) return showToast('Wajib isi keterangan untuk kategori Lainnya!');
            finalTitle = note ? `Lainnya: ${otherDetail} (${note})` : `Lainnya: ${otherDetail}`;
          }
          const wId = document.getElementById('tx-wallet').value;
          const tx = { id: 'tx_' + Date.now(), walletId: wId, type: modalTxType, amount, title: finalTitle, category: selectedCategory, isAuto: false, createdAt: new Date().toISOString() };
          applyWalletEffect(tx);
          state.transactions.unshift(tx);
        }
        document.getElementById('modal-add').classList.remove('open');
        saveState();
        showToast('Transaksi berhasil disimpan');
      };
    }

    function openEditTxModal(txId) {
      const tx = state.transactions.find(t => t.id === txId);
      if (!tx || tx.type === 'sync') return;
      const box = document.getElementById('modal-generic-box');
      const cats = tx.type === 'income' ? INCOME_CATS : tx.type === 'transfer' ? ['Transfer'] : getExpenseCategories();

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b style="font-size:14px;">✎ Edit Transaksi Aman</b>
          <button class="act-icon" data-action="close-modals">✕</button>
        </div>
        <p style="font-size:11px; color:var(--muted);">Perubahan nominal atau dompet akan menghitung ulang saldo secara otomatis dan memberi tanda <b>[DIEDIT]</b>.</p>

        <div>
          <span class="label-xs">Judul / Keterangan</span>
          <input id="etx-title" type="text" value="${esc(tx.title)}" style="margin-top:4px; margin-bottom:8px;" />

          <span class="label-xs">Nominal (Rp)</span>
          <input id="etx-amount" type="number" min="1" value="${tx.amount}" style="margin-top:4px; margin-bottom:8px; font-weight:700;" />

          ${tx.type !== 'transfer' ? `
            <span class="label-xs">Kategori</span>
            <select id="etx-cat" style="margin-top:4px; margin-bottom:8px;">
              ${cats.map(c => `<option value="${esc(c)}" ${tx.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
            </select>

            <span class="label-xs">Dompet</span>
            <select id="etx-wallet" style="margin-top:4px;">
              ${state.wallets.map(w => `<option value="${w.id}" ${tx.walletId === w.id ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}
            </select>
          ` : ''}
        </div>

        <div style="display:flex; gap:8px;">
          <button class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
          <button id="save-etx-btn" class="btn-primary" style="flex:1;">Simpan Perubahan</button>
        </div>
      `;
      document.getElementById('modal-generic').classList.add('open');

      document.getElementById('save-etx-btn').onclick = () => {
        const nextTitle = document.getElementById('etx-title').value.trim();
        const nextAmount = parseInt(document.getElementById('etx-amount').value, 10);
        if (!nextTitle || !nextAmount || nextAmount <= 0) return showToast('Judul dan nominal harus valid');

        const nextCat = tx.type !== 'transfer' ? document.getElementById('etx-cat').value : 'Transfer';
        if (nextCat === 'Lainnya' && !nextTitle.toLowerCase().includes('lainnya:')) {
          return showToast('Sertakan keterangan jelas untuk kategori Lainnya');
        }

        applyWalletEffect(tx, true);
        tx.title = nextTitle;
        tx.amount = nextAmount;
        tx.category = nextCat;
        if (tx.type !== 'transfer') {
          tx.walletId = document.getElementById('etx-wallet').value;
        }
        tx.isEdited = true;
        applyWalletEffect(tx, false);

        document.getElementById('modal-generic').classList.remove('open');
        saveState();
        showToast('Transaksi diperbarui & saldo disinkronkan');
      };
    }

    // Delegasi Klik Global
    document.body.addEventListener('click', (e) => {
      const tabBtn = e.target.closest('[data-tab]');
      if (tabBtn) { activeTab = tabBtn.dataset.tab; renderAll(); return; }

      const txTab = e.target.closest('[data-tx-tab]');
      if (txTab) {
        modalTxType = txTab.dataset.txTab;
        preselectTransferToId = null;
        renderAddModalBody();
        return;
      }

      const actEl = e.target.closest('[data-action]');
      if (!actEl) return;
      const action = actEl.dataset.action;

      if (action === 'set-theme') {
        state.settings.themeMode = actEl.dataset.themeVal;
        saveState();
        openSystemSettingsModal();
        const lbl = state.settings.themeMode === 'light' ? 'Light Mode' : state.settings.themeMode === 'system' ? 'Ikuti Sistem' : 'Dark Mode';
        showToast(`Tema diubah ke ${lbl}`);
      } else if (action === 'report-sub-tab') {
        reportSubTab = actEl.dataset.val;
        renderAll();
      } else if (action === 'toggle-auto') {
        state.settings.autoTrackingEnabled = !state.settings.autoTrackingEnabled;
        if (state.settings.autoTrackingEnabled) state.settings.autoEnabledAt = new Date().toISOString();
        saveState();
      } else if (action === 'toggle-hide') {
        state.settings.hideBalance = !state.settings.hideBalance;
        saveState();
        if (document.getElementById('modal-generic').classList.contains('open')) openSystemSettingsModal();
      } else if (action === 'toggle-budget-zone') {
        const z = actEl.dataset.zone;
        if (z === 'A') state.settings.enableBudgetZoneA = !(state.settings.enableBudgetZoneA !== false);
        if (z === 'B') state.settings.enableBudgetZoneB = !(state.settings.enableBudgetZoneB !== false);
        saveState();
        openSystemSettingsModal();
      } else if (action === 'open-settings') {
        openSystemSettingsModal();
      } else if (action === 'toggle-cluster-edit') {
        const c = actEl.dataset.cluster;
        clusterEditMode[c] = !clusterEditMode[c];
        renderAll();
      } else if (action === 'click-wallet') {
        const cluster = actEl.dataset.cluster;
        if (!clusterEditMode[cluster]) {
          showToast('Terkunci — Klik "Mode Edit" di kluster ini untuk mengedit');
          return;
        }
        openWalletEditModal(actEl.dataset.id);
      } else if (action === 'add-cluster-wallet') {
        const cluster = actEl.dataset.cluster;
        const label = cluster === 'bank' ? 'Bank' : cluster === 'ewallet' ? 'E-Wallet' : cluster === 'invest' ? 'Investasi & Tabungan' : 'Dompet Fisik';
        const placeholder = cluster === 'bank' ? 'Contoh: BRImo / BCA' : cluster === 'ewallet' ? 'Contoh: GoPay / DANA' : cluster === 'invest' ? 'Contoh: Bibit / Celengan PC' : 'Contoh: Dompet Utama';
        const box = document.getElementById('modal-generic-box');
        box.innerHTML = `
          <b style="font-size:14px;">+ Tambah Akun ${label}</b>
          <div>
            <span class="label-xs">Nama ${label}</span>
            <input id="new-w-name" type="text" placeholder="${placeholder}" style="margin-top:4px; margin-bottom:8px;" />
            <span class="label-xs">Saldo Awal (Rp)</span>
            <input id="new-w-bal" type="number" value="0" style="margin-top:4px; font-weight:700;" />
          </div>
          <div style="display:flex; gap:8px;">
            <button class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
            <button id="save-new-w" class="btn-primary" style="flex:1;">Tambahkan</button>
          </div>
        `;
        document.getElementById('modal-generic').classList.add('open');
        document.getElementById('save-new-w').onclick = () => {
          const name = document.getElementById('new-w-name').value.trim();
          const bal = parseInt(document.getElementById('new-w-bal').value, 10) || 0;
          if (!name) return;
          const newId = 'w_' + Date.now();
          state.wallets.push({ id: newId, name, category: cluster, balance: bal });
          if (cluster !== 'invest') {
            PERIOD_KEYS.forEach(pk => {
              if (!state.budgetsByPeriod[pk].includedWalletIds.includes(newId)) {
                state.budgetsByPeriod[pk].includedWalletIds.push(newId);
              }
            });
          }
          document.getElementById('modal-generic').classList.remove('open');
          saveState();
        };
      } else if (action === 'fill-cash-amt') {
        const amtInp = document.getElementById('cash-amt-inp');
        const descInp = document.getElementById('cash-desc-inp');
        if (amtInp) amtInp.value = actEl.dataset.amt;
        if (descInp && !descInp.value.trim()) descInp.focus();
      } else if (action === 'history-type-filter') {
        historyTypeFilter = actEl.dataset.val; renderAll();
      } else if (action === 'switch-budget-period') {
        state.activeBudgetPeriod = actEl.dataset.period;
        saveState();
      } else if (action === 'open-custom-period-modal') {
        openCustomPeriodModal();
      } else if (action === 'toggle-budget-wallet') {
        const wid = actEl.dataset.wid;
        const pCfg = state.budgetsByPeriod[state.activeBudgetPeriod];
        if (pCfg.includedWalletIds.includes(wid)) {
          pCfg.includedWalletIds = pCfg.includedWalletIds.filter(id => id !== wid);
        } else {
          pCfg.includedWalletIds.push(wid);
        }
        saveState();
      } else if (action === 'open-goal-modal') {
        openSavingsGoalModal(actEl.dataset.gid || null);
      } else if (action === 'delete-goal') {
        state.savingsGoals = state.savingsGoals.filter(g => g.id !== actEl.dataset.gid);
        saveState();
        showToast('Kantong tabungan dihapus');
      } else if (action === 'quick-setor-goal') {
        if (state.wallets.length < 2) {
          return showToast('Butuh minimal 2 dompet (mis. BRImo dan Bibit) untuk setor transfer');
        }
        modalTxType = 'transfer';
        preselectTransferToId = actEl.dataset.wid;
        document.getElementById('modal-add').classList.add('open');
        renderAddModalBody();
      } else if (action === 'realize-goal') {
        openRealizeGoalModal(actEl.dataset.gid);
      } else if (action === 'open-expense-post-modal') {
        openExpensePostModal(actEl.dataset.cat || null);
      } else if (action === 'delete-expense-post') {
        const cat = actEl.dataset.cat;
        delete state.budgetsByPeriod[state.activeBudgetPeriod].allocations[cat];
        saveState();
        showToast(`Pos anggaran "${cat}" dihapus`);
      } else if (action === 'open-add') {
        preselectTransferToId = null;
        document.getElementById('modal-add').classList.add('open');
        renderAddModalBody();
      } else if (action === 'edit-tx') {
        openEditTxModal(actEl.dataset.id);
      } else if (action === 'confirm-delete-tx') {
        const tx = state.transactions.find(t => t.id === actEl.dataset.id);
        if (!tx) return;
        const box = document.getElementById('modal-generic-box');
        box.innerHTML = `
          <b style="font-size:14px; color:var(--red);">Hapus Riwayat Ini?</b>
          <p style="font-size:12px; color:var(--text-2);"><b>${esc(tx.title)}</b> (${rp(tx.amount)})</p>
          <p style="font-size:11px; color:var(--muted);">Saldo dompet terkait akan otomatis dikembalikan ke kondisi sebelum catatan ini dibuat.</p>
          <div style="display:flex; gap:8px;">
            <button class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
            <button id="exec-del-tx" class="btn-danger" style="flex:1;">Ya, Hapus</button>
          </div>
        `;
        document.getElementById('modal-generic').classList.add('open');
        document.getElementById('exec-del-tx').onclick = () => {
          const idx = state.transactions.findIndex(t => t.id === tx.id);
          if (idx > -1) {
            applyWalletEffect(state.transactions[idx], true);
            state.transactions.splice(idx, 1);
          }
          document.getElementById('modal-generic').classList.remove('open');
          saveState();
          showToast('Catatan dihapus & saldo dipulihkan');
        };
      } else if (action === 'close-modals') {
        document.getElementById('modal-add').classList.remove('open');
        document.getElementById('modal-generic').classList.remove('open');
      } else if (action === 'pick-cat') {
        selectedCategory = actEl.dataset.cat;
        renderAddModalBody();
      } else if (action === 'chart-type') {
        chartType = actEl.dataset.val;
        drilldownCat = null;
        renderAll();
      } else if (action === 'period-filter') {
        periodFilter = actEl.dataset.val;
        drilldownCat = null;
        renderAll();
      } else if (action === 'chart-view') {
        chartViewMode = actEl.dataset.val;
        drilldownCat = null;
        renderAll();
      } else if (action === 'drill-cat') {
        const c = actEl.dataset.cat;
        drilldownCat = drilldownCat === c ? null : c;
        renderAll();
      } else if (action === 'notes-status-filter') {
        notesStatusFilter = actEl.dataset.val;
        renderAll();
      } else if (action === 'open-note-cluster-modal') {
        openNoteClusterModal(actEl.dataset.cid || null);
      } else if (action === 'fill-nc-name') {
        const inp = document.getElementById('nc-name-inp');
        if (inp) { inp.value = actEl.dataset.val; inp.focus(); }
      } else if (action === 'delete-note-cluster') {
        const cl = state.noteClusters.find(c => c.id === actEl.dataset.cid);
        if (!cl) return;
        const count = state.notes.filter(n => n.clusterId === cl.id).length;
        const box = document.getElementById('modal-generic-box');
        box.innerHTML = `
          <b style="font-size:14px; color:var(--red);">Hapus Kluster "${esc(cl.name)}"?</b>
          <p style="font-size:11px; color:var(--muted);">Seluruh catatan di dalam kluster ini (${count} item) juga akan ikut terhapus.</p>
          <div style="display:flex; gap:8px;">
            <button class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
            <button id="exec-del-nc" class="btn-danger" style="flex:1;">Ya, Hapus</button>
          </div>
        `;
        document.getElementById('modal-generic').classList.add('open');
        document.getElementById('exec-del-nc').onclick = () => {
          state.noteClusters = state.noteClusters.filter(c => c.id !== cl.id);
          state.notes = state.notes.filter(n => n.clusterId !== cl.id);
          document.getElementById('modal-generic').classList.remove('open');
          saveState();
          showToast('Kluster dihapus');
        };
      } else if (action === 'open-add-note') {
        openNoteFormModal(actEl.dataset.cid, null);
      } else if (action === 'edit-note') {
        const nt = state.notes.find(n => n.id === actEl.dataset.nid);
        if (nt) openNoteFormModal(nt.clusterId, nt.id);
      } else if (action === 'toggle-note-done') {
        const nt = state.notes.find(n => n.id === actEl.dataset.nid);
        if (!nt) return;
        const cl = state.noteClusters.find(c => c.id === nt.clusterId);
        const linkedWallet = (cl && cl.linkedWalletId) ? state.wallets.find(w => w.id === cl.linkedWalletId) : null;

        if (!nt.isDone) {
          nt.isDone = true;
          if (linkedWallet && nt.amount > 0) {
            const txType = cl.linkedTxType || 'expense';
            const cat = cl.linkedCategory || (txType === 'income' ? 'Gaji & Uang Saku' : autoCategory(nt.title));
            const rawTitle = `[${cl.name}] ${nt.title}`;
            const finalTitle = cat === 'Lainnya' ? `Lainnya: ${rawTitle}` : rawTitle;

            const tx = {
              id: 'tx_' + Date.now(),
              walletId: linkedWallet.id,
              type: txType,
              amount: nt.amount,
              title: finalTitle,
              category: cat,
              isAuto: false,
              createdAt: new Date().toISOString()
            };
            applyWalletEffect(tx);
            state.transactions.unshift(tx);
            nt.linkedTxId = tx.id;
            saveState();
            showToast(`✓ Tercatat ke ${txType === 'income' ? 'Pemasukan' : 'Pengeluaran'} (${linkedWallet.name}): ${rp(nt.amount)}`);
            return;
          }
          saveState();
          if (linkedWallet && nt.amount <= 0) {
            showToast('Ditandai selesai (nominal Rp 0, saldo dompet tetap)');
          }
        } else {
          nt.isDone = false;
          if (nt.linkedTxId) {
            const txIdx = state.transactions.findIndex(t => t.id === nt.linkedTxId);
            if (txIdx > -1) {
              applyWalletEffect(state.transactions[txIdx], true);
              state.transactions.splice(txIdx, 1);
            }
            nt.linkedTxId = null;
            saveState();
            showToast('Centang dibatalkan — Transaksi otomatis dihapus & saldo dipulihkan');
            return;
          }
          saveState();
        }
      } else if (action === 'delete-note') {
        state.notes = state.notes.filter(n => n.id !== actEl.dataset.nid);
        saveState();
        showToast('Catatan dihapus');
      } else if (action === 'realize-note') {
        openRealizeNoteModal(actEl.dataset.nid);
      } else if (action === 'sim-notif') {
        const sim = actEl.dataset.sim;
        if (sim === 'qris') processIncomingNotification('com.gojek.app', 'GoPay', 'Pembayaran QRIS Rp18.000 di WARUNG NASI PADANG berhasil');
        if (sim === 'topup') processIncomingNotification('com.bca', 'BCA mobile', 'Transfer ke GoPay Rp100.000 berhasil');
        if (sim === 'shopee') processIncomingNotification('com.shopee.id', 'Shopee', 'Pembayaran Rp18.000 untuk Kabel Data Type-C terkonfirmasi');
        if (sim === 'unparsed') processIncomingNotification('com.bank.asing', 'Info Bank', 'Mutasi rekening berhasil diproses sistem');
      } else if (action === 'open-unparsed') {
        const box = document.getElementById('modal-generic-box');
        box.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <b style="font-size:13px; color:var(--text-amber);">⚠️ Notifikasi Belum Terbaca (${state.unparsedLogs.length})</b>
            <button class="act-icon" data-action="close-modals">✕</button>
          </div>
          ${state.unparsedLogs.length === 0 ? '<p style="font-size:12px; color:var(--muted); text-align:center; padding:16px 0;">Semua notifikasi terbaca rapi.</p>' :
            state.unparsedLogs.map(u => `
              <div style="background:var(--bg); border:1px solid var(--border); padding:10px; border-radius:12px; font-size:11px;">
                <p style="margin-bottom:8px;">${esc(u.rawText)}</p>
                <button class="btn-primary" style="padding:5px 10px; font-size:11px;" data-action="dismiss-unp" data-id="${u.id}">Tandai Selesai</button>
              </div>
            `).join('')}
        `;
        document.getElementById('modal-generic').classList.add('open');
      } else if (action === 'dismiss-unp') {
        state.unparsedLogs = state.unparsedLogs.filter(u => u.id !== actEl.dataset.id);
        document.getElementById('modal-generic').classList.remove('open');
        saveState();
      } else if (action === 'export-json') {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
        a.download = `finos-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        showToast('File cadangan .JSON diunduh');
      } else if (action === 'import-json') {
        document.getElementById('import-json-input').click();
      } else if (action === 'reset-empty') {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(LEGACY_KEY);
        location.reload();
      }
    });

    document.getElementById('import-json-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed || !Array.isArray(parsed.wallets) || !Array.isArray(parsed.transactions)) {
            return showToast('Format file cadangan tidak valid');
          }
          state = hydrateState(parsed);
          document.getElementById('modal-generic').classList.remove('open');
          saveState();
          showToast('Data berhasil dipulihkan dari file cadangan');
        } catch (err) {
          showToast('Gagal membaca file JSON');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    document.body.addEventListener('change', (e) => {
      const act = e.target.dataset.action;
      if (act === 'wallet-filter') {
        walletFilter = e.target.value;
        drilldownCat = null;
        renderAll();
      } else if (act === 'history-wallet-filter') {
        historyWalletFilter = e.target.value;
        renderAll();
      } else if (act === 'chart-select-month') {
        chartSelectedMonth = parseInt(e.target.value, 10);
        drilldownCat = null;
        renderAll();
      } else if (act === 'chart-select-year') {
        chartSelectedYear = parseInt(e.target.value, 10);
        drilldownCat = null;
        renderAll();
      } else if (act === 'chart-date-start') {
        chartCustomStart = e.target.value || firstDayMonth;
        drilldownCat = null;
        renderAll();
      } else if (act === 'chart-date-end') {
        chartCustomEnd = e.target.value || todayStr;
        drilldownCat = null;
        renderAll();
      }
    });

    renderAll();
  </script>
</body>
</html>
