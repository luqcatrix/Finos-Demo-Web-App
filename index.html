<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FinOS — Personal Finance</title>

  <!-- PWA & Mobile App Mode Meta -->
  <meta id="meta-theme-color" name="theme-color" content="#020617" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FinOS" />
  <link id="pwa-icon" rel="apple-touch-icon" href="" />
  <link id="pwa-manifest" rel="manifest" href="" />

  <script>
    (function setupPWA() {
      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="112" fill="#020617"/>
        <rect x="48" y="48" width="416" height="416" rx="88" fill="#10b981"/>
        <text x="256" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="270" font-weight="900" fill="#020617" text-anchor="middle">F</text>
      </svg>`;
      const iconDataUri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgIcon);
      document.getElementById('pwa-icon').href = iconDataUri;

      const manifest = {
        name: 'FinOS — Catatan Keuangan',
        short_name: 'FinOS',
        description: 'Pencatat keuangan pribadi, dompet, dual-zone budget, investasi, dan catatan terintegrasi',
        start_url: window.location.origin + window.location.pathname,
        scope: window.location.origin + '/',
        display: 'standalone',
        orientation: 'portrait',
        background_color: '#020617',
        theme_color: '#020617',
        icons: [
          { src: iconDataUri, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
          { src: iconDataUri, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
        ]
      };
      document.getElementById('pwa-manifest').href =
        'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    })();
  </script>

  <style>
    :root, [data-theme="dark"] {
      --outer-bg: #000000;
      --bg: #020617;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --surface-hover: #334155;
      --border: #1e293b;
      --border-strong: #334155;
      --border-dashed: #475569;
      --subtle-line: rgba(255, 255, 255, 0.08);
      --header-bg: rgba(2, 6, 23, 0.92);
      --nav-bg: rgba(2, 6, 23, 0.96);
      --hero-bg: linear-gradient(145deg, #0f172a, #064e3b55);
      --zone-saving-bg: linear-gradient(155deg, rgba(15, 23, 42, 0.95), rgba(56, 189, 248, 0.08));
      --cluster-bg: rgba(15, 23, 42, 0.55);
      --inner-panel: rgba(2, 6, 23, 0.55);
      --note-done-bg: rgba(15, 23, 42, 0.45);
      --card-shadow: none;

      --text: #f8fafc;
      --text-2: #cbd5e1;
      --muted: #94a3b8;
      --faint: #64748b;

      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.15);
      --text-green: #6ee7b7;

      --red: #f43f5e;
      --red-soft: rgba(244, 63, 94, 0.15);
      --text-red: #fda4af;

      --blue: #38bdf8;
      --blue-soft: rgba(56, 189, 248, 0.15);
      --text-blue: #7dd3fc;

      --purple: #a78bfa;
      --purple-soft: rgba(167, 139, 250, 0.15);

      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.15);
      --text-amber: #fcd34d;
    }

    [data-theme="light"] {
      --outer-bg: #e2e8f0;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --surface-hover: #e2e8f0;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --border-dashed: #94a3b8;
      --subtle-line: rgba(15, 23, 42, 0.08);
      --header-bg: rgba(248, 250, 252, 0.92);
      --nav-bg: rgba(255, 255, 255, 0.96);
      --hero-bg: linear-gradient(145deg, #ffffff, #d1fae5);
      --zone-saving-bg: linear-gradient(155deg, #ffffff, rgba(2, 132, 199, 0.09));
      --cluster-bg: rgba(255, 255, 255, 0.85);
      --inner-panel: #f1f5f9;
      --note-done-bg: rgba(241, 245, 249, 0.75);
      --card-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);

      --text: #0f172a;
      --text-2: #334155;
      --muted: #64748b;
      --faint: #94a3b8;

      --green: #059669;
      --green-soft: rgba(5, 150, 105, 0.12);
      --text-green: #047857;

      --red: #e11d48;
      --red-soft: rgba(225, 29, 72, 0.11);
      --text-red: #be123c;

      --blue: #0284c7;
      --blue-soft: rgba(2, 132, 199, 0.12);
      --text-blue: #0369a1;

      --purple: #7c3aed;
      --purple-soft: rgba(124, 58, 237, 0.12);

      --amber: #d97706;
      --amber-soft: rgba(217, 119, 6, 0.13);
      --text-amber: #b45309;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--outer-bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; transition: background 0.2s, color 0.2s; }
    .app { width: 100%; max-width: 430px; background: var(--bg); min-height: 100vh; padding-bottom: calc(92px + env(safe-area-inset-bottom)); border-x: 1px solid var(--border); position: relative; transition: background 0.2s; }

    /* Header */
    header { position: sticky; top: 0; z-index: 20; background: var(--header-bg); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: calc(11px + env(safe-area-inset-top)) 14px 11px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; white-space: nowrap; color: var(--text); }
    .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--green); color: #ffffff; display: grid; place-items: center; font-weight: 900; flex-shrink: 0; }
    [data-theme="dark"] .logo { color: #020617; }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .pill-btn { border: 1px solid var(--border); background: var(--surface); color: var(--muted); padding: 5px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .pill-btn.active { background: var(--green-soft); border-color: rgba(16,185,129,0.4); color: var(--text-green); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .pill-btn.active .dot { background: var(--green); }
    .icon-btn { position: relative; background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 31px; height: 31px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; font-size: 14px; flex-shrink: 0; }
    .icon-btn:hover { border-color: var(--border-strong); }
    .badge { position: absolute; top: -4px; right: -4px; background: var(--amber); color: #000; font-size: 10px; font-weight: 800; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; }

    /* Layout & Cards */
    main { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 15px; box-shadow: var(--card-shadow); }
    .hero { background: var(--hero-bg); }
    .label-xs { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    .hero-amount { font-size: 28px; font-weight: 800; margin: 6px 0 14px; letter-spacing: -0.5px; color: var(--text); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid var(--subtle-line); padding-top: 12px; font-size: 11px; }
    .grid-3 b { display: block; font-size: 12px; margin-top: 2px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .hero-grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; border-top: 1px solid var(--subtle-line); padding-top: 12px; font-size: 11px; }
    .hero-grid-4 b { display: block; font-size: 12.5px; margin-top: 2px; }

    /* Zone Header Badges in Budget */
    .zone-banner { border-radius: 18px; padding: 13px 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--card-shadow); }
    .zone-saving { background: var(--zone-saving-bg); border: 1px solid rgba(56, 189, 248, 0.35); }
    .zone-expense { background: var(--surface); border: 1px solid var(--border); }
    .zone-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 99px; letter-spacing: 0.3px; text-transform: uppercase; }
    .zone-tag-blue { background: var(--blue-soft); color: var(--text-blue); }
    .zone-tag-green { background: var(--green-soft); color: var(--text-green); }
    .goal-card { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 11px 12px; }
    .goal-card.achieved { border-color: rgba(16, 185, 129, 0.55); background: rgba(16, 185, 129, 0.06); }

    /* Settings Toggle Switch Rows */
    .setting-toggle-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 9px 11px; }
    .switch-pill { border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--muted); padding: 5px 11px; border-radius: 99px; font-size: 11px; font-weight: 800; cursor: pointer; min-width: 58px; text-align: center; transition: 0.15s; flex-shrink: 0; }
    .switch-pill.on-blue { background: var(--blue-soft); border-color: rgba(56, 189, 248, 0.5); color: var(--text-blue); }
    .switch-pill.on-green { background: var(--green-soft); border-color: rgba(16, 185, 129, 0.5); color: var(--text-green); }

    /* Metric KPI Cards in Chart */
    .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px; box-shadow: var(--card-shadow); }
    .kpi-val { font-size: 15px; font-weight: 800; margin-top: 4px; color: var(--text); }
    .kpi-sub { font-size: 10px; color: var(--muted); margin-top: 3px; display: block; }
    .trend-pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; margin-top: 4px; }
    .trend-good { background: var(--green-soft); color: var(--text-green); }
    .trend-bad { background: var(--red-soft); color: var(--text-red); }
    .trend-neutral { background: var(--surface-2); color: var(--muted); }

    /* Time Picker Bar in Chart */
    .time-picker-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .time-picker-bar select, .time-picker-bar input { padding: 6px 9px; font-size: 11px; font-weight: 600; }

    /* Analytics Table */
    .data-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .data-table th { text-align: left; color: var(--muted); font-weight: 700; padding: 7px 6px; border-bottom: 1px solid var(--border); font-size: 10px; text-transform: uppercase; }
    .data-table td { padding: 9px 6px; border-bottom: 1px solid var(--border); color: var(--text-2); }
    .data-table tr:last-child td { border-bottom: none; }
    .num-col { text-align: right; font-variant-numeric: tabular-nums; }

    /* Donut & Drilldown */
    .donut-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .donut-box { position: relative; width: 118px; height: 118px; flex-shrink: 0; }
    .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; padding: 14px; }
    .cat-row-btn { width: 100%; background: transparent; border: 1px solid transparent; border-radius: 12px; padding: 7px 8px; text-align: left; color: var(--text); cursor: pointer; transition: 0.15s; }
    .cat-row-btn:hover, .cat-row-btn.active { background: var(--bg); border-color: var(--border); }
    .drill-box { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; margin-top: 8px; }

    /* Cluster Sections */
    .cluster-box { background: var(--cluster-bg); border: 1px solid var(--border); border-radius: 18px; padding: 12px; transition: border-color 0.2s; box-shadow: var(--card-shadow); }
    .cluster-box.editing { border-color: var(--amber); background: rgba(245, 158, 11, 0.05); }
    .cluster-box.invest-box { border-color: rgba(56, 189, 248, 0.35); }
    .cluster-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 6px; }
    .cluster-title { font-size: 12px; font-weight: 700; color: var(--text); }
    .cluster-sub { font-size: 11px; color: var(--text-green); font-weight: 700; margin-left: 6px; }
    .edit-mode-btn { background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text-2); padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .edit-mode-btn.active { background: var(--amber); border-color: var(--amber); color: #020617; }
    .wallets-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .wallet-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 11px; transition: 0.15s; position: relative; }
    .wallet-card.locked { cursor: default; }
    .wallet-card.unlocked { cursor: pointer; border-color: rgba(245, 158, 11, 0.7); }
    .wallet-card.unlocked:hover { border-color: var(--amber); transform: translateY(-1px); }
    .wallet-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .wallet-bal { font-size: 14px; font-weight: 800; color: var(--text); }
    .add-wallet-slot { border: 1px dashed var(--border-dashed); background: transparent; border-radius: 14px; padding: 11px; color: var(--text-amber); font-size: 11px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; min-height: 62px; }
    .empty-hint { font-size: 11px; color: var(--muted); padding: 6px 2px; line-height: 1.4; }

    /* Custom Financial Notes & Visual Integration Picker */
    .wallet-link-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-top: 4px; }
    .link-exp { background: var(--blue-soft); color: var(--text-blue); border: 1px solid rgba(56, 189, 248, 0.35); }
    .link-inc { background: var(--green-soft); color: var(--text-green); border: 1px solid rgba(16, 185, 129, 0.35); }
    .link-none { background: var(--surface-2); color: var(--muted); }

    .mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .mode-card { background: var(--bg); border: 1.5px solid var(--border); border-radius: 14px; padding: 10px; text-align: left; cursor: pointer; transition: 0.15s; color: var(--text); }
    .mode-card:hover { border-color: var(--border-strong); }
    .mode-card.active-stand { border-color: var(--green); background: rgba(16, 185, 129, 0.08); }
    .mode-card.active-link { border-color: var(--blue); background: rgba(56, 189, 248, 0.09); }
    .mode-card-title { font-size: 11.5px; font-weight: 800; display: block; margin-bottom: 3px; }
    .mode-card-desc { font-size: 10px; color: var(--muted); line-height: 1.3; display: block; }

    .wallet-pick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 6px; }
    .wallet-pick-btn { background: var(--surface); border: 1.5px solid var(--border); border-radius: 11px; padding: 8px 9px; text-align: left; cursor: pointer; color: var(--text); transition: 0.15s; }
    .wallet-pick-btn.selected { border-color: var(--blue); background: rgba(56, 189, 248, 0.12); }
    .wallet-pick-name { font-size: 11.5px; font-weight: 700; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wallet-pick-bal { font-size: 10px; color: var(--muted); display: block; margin-top: 2px; }
    .wallet-pick-btn.selected .wallet-pick-bal { color: var(--text-blue); }

    .flow-toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .flow-toggle-btn { background: var(--surface); border: 1.5px solid var(--border); border-radius: 11px; padding: 8px; text-align: center; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--muted); }
    .flow-toggle-btn.active-exp { border-color: var(--red); background: var(--red-soft); color: var(--text-red); }
    .flow-toggle-btn.active-inc { border-color: var(--green); background: var(--green-soft); color: var(--text-green); }

    .mini-chip-wrap { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .mini-chip { background: var(--surface); border: 1px solid var(--border); color: var(--text-2); padding: 5px 8px; border-radius: 8px; font-size: 10.5px; font-weight: 600; cursor: pointer; }
    .mini-chip.selected { background: var(--blue-soft); border-color: var(--blue); color: var(--text-blue); }

    .note-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 11px; display: flex; align-items: flex-start; gap: 9px; transition: 0.15s; }
    .note-item.done { opacity: 0.65; background: var(--note-done-bg); }
    .note-check { width: 21px; height: 21px; border-radius: 6px; border: 1.5px solid var(--border-dashed); background: var(--bg); color: #ffffff; display: grid; place-items: center; font-size: 12px; font-weight: 900; cursor: pointer; flex-shrink: 0; margin-top: 1px; }
    [data-theme="dark"] .note-check { color: #020617; }
    .note-check.checked { background: var(--green); border-color: var(--green); }
    .note-title { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.35; }
    .note-item.done .note-title { text-decoration: line-through; color: var(--muted); }
    .note-due { display: inline-block; font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; }
    .due-normal { background: var(--surface-2); color: var(--muted); }
    .due-soon { background: var(--amber-soft); color: var(--text-amber); }
    .due-over { background: var(--red-soft); color: var(--text-red); }
    .tx-synced-tag { display: inline-block; font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--green-soft); color: var(--text-green); }
    .suggest-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .suggest-chip { background: var(--bg); border: 1px solid var(--border); color: var(--text-2); padding: 5px 9px; border-radius: 99px; font-size: 10.5px; cursor: pointer; }
    .suggest-chip:hover { border-color: var(--green); color: var(--text-green); }

    /* Quick Cash Form */
    .cash-fields { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; margin: 10px 0 8px; }
    .field-label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    input, select { background: var(--bg); border: 1px solid var(--border-strong); color: var(--text); border-radius: 12px; padding: 9px 11px; font-size: 12px; outline: none; width: 100%; }
    input:focus, select:focus { border-color: var(--green); }
    .btn-primary { background: var(--green); color: #ffffff; border: none; border-radius: 12px; padding: 10px 14px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    [data-theme="dark"] .btn-primary { color: #020617; }
    .btn-blue { background: var(--blue); color: #ffffff; border: none; border-radius: 10px; padding: 7px 11px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    [data-theme="dark"] .btn-blue { color: #020617; }
    .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong); border-radius: 10px; padding: 6px 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .btn-danger { background: var(--red-soft); color: var(--text-red); border: 1px solid rgba(244, 63, 94, 0.4); border-radius: 12px; padding: 10px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .preset-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); padding: 6px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .preset-btn:hover { background: var(--surface-hover); }

    /* Wallet Scope Chips in Budget */
    .scope-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .scope-chip { background: var(--surface); border: 1px solid var(--border-strong); color: var(--muted); padding: 5px 10px; border-radius: 99px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .scope-chip.active { background: var(--green-soft); border-color: rgba(16,185,129,0.5); color: var(--text-green); }

    /* Transactions List */
    .tx-list { display: flex; flex-direction: column; gap: 8px; }
    .tx-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 11px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; box-shadow: var(--card-shadow); }
    .tx-item.sync-row { border-style: dashed; border-color: rgba(167, 139, 250, 0.45); background: var(--cluster-bg); }
    .tx-title { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; color: var(--text); }
    .badge-mode { font-size: 9px; padding: 1px 5px; border-radius: 4px; font-weight: 700; flex-shrink: 0; }
    .badge-auto { background: var(--blue-soft); color: var(--text-blue); }
    .badge-manual { background: var(--surface-2); color: var(--muted); }
    .badge-sync { background: var(--purple-soft); color: var(--purple); }
    .badge-edited { background: var(--amber-soft); color: var(--text-amber); }
    .tx-meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
    .amt-in { color: var(--green); font-weight: 700; font-size: 12px; }
    .amt-out { color: var(--red); font-weight: 700; font-size: 12px; }
    .amt-trf { color: var(--blue); font-weight: 700; font-size: 12px; }
    .amt-sync { color: var(--purple); font-weight: 700; font-size: 12px; }
    .act-icon { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 4px; }
    .act-icon:hover { color: var(--text); }
    .act-icon.del:hover { color: var(--red); }

    /* Segmented Tabs & Progress Bars */
    .seg-tabs { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; gap: 4px; overflow-x: auto; }
    .seg-btn { flex: 1; padding: 7px 6px; border: none; border-radius: 9px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .seg-btn.active { background: var(--green); color: #ffffff; }
    [data-theme="dark"] .seg-btn.active { color: #020617; }
    .seg-btn.active-sub { background: var(--surface-2); color: var(--text); }
    .bar-bg { width: 100%; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 6px 0; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width 0.25s; }
    .warn-banner { background: var(--amber-soft); border: 1px solid rgba(245,158,11,0.45); color: var(--text-amber); border-radius: 12px; padding: 9px 11px; font-size: 11px; line-height: 1.4; }

    /* Bottom Nav — 5 Slot Simetris */
    nav { position: fixed; bottom: 0; width: 100%; max-width: 430px; background: var(--nav-bg); border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr auto 1fr 1fr; align-items: center; padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); z-index: 30; }
    .nav-btn { background: none; border: none; color: var(--faint); font-size: 10px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; }
    .nav-btn.active { color: var(--green); }
    .nav-btn span.ico { font-size: 17px; }
    .fab { margin: -26px 8px 0; width: 48px; height: 48px; border-radius: 16px; background: var(--green); color: #ffffff; border: none; font-size: 24px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 20px rgba(16,185,129,0.35); display: grid; place-items: center; }
    [data-theme="dark"] .fab { color: #020617; }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.68); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal-box { width: 100%; max-width: 430px; max-height: 90vh; overflow-y: auto; background: var(--surface); border-top: 1px solid var(--border-strong); border-radius: 24px 24px 0 0; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -10px 30px rgba(0,0,0,0.25); }
    .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .cat-chip { background: var(--bg); border: 1px solid var(--border); color: var(--text-2); padding: 8px 4px; border-radius: 10px; font-size: 11px; text-align: center; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cat-chip.selected { background: var(--green-soft); border-color: var(--green); color: var(--text-green); font-weight: 700; }
    .other-box { background: var(--amber-soft); border: 1px solid rgba(245, 158, 11, 0.5); border-radius: 12px; padding: 10px; }
    .other-box label { display: block; font-size: 11px; font-weight: 700; color: var(--text-amber); margin-bottom: 5px; }
    .sim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .sim-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 12px; font-size: 11px; text-align: left; cursor: pointer; line-height: 1.35; }
    .sim-btn:hover { background: var(--surface-hover); }

    /* Toast */
    .toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--amber); color: var(--text); padding: 8px 14px; border-radius: 99px; font-size: 11px; font-weight: 600; z-index: 60; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.28); max-width: 92%; text-align: center; }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>
  <input type="file" id="import-json-input" accept=".json,application/json" style="display:none;" />

  <div class="app">
    <header>
      <div class="brand"><div class="logo">F</div> FinOS</div>
      <div class="header-actions">
        <button id="btn-auto-toggle" class="pill-btn active" data-action="toggle-auto">
          <span class="dot"></span> <span id="auto-label">Auto: ON</span>
        </button>
        <button class="icon-btn" data-action="open-unparsed" title="Notifikasi gagal baca">
          🔔 <span id="unparsed-badge" class="badge" style="display:none;">0</span>
        </button>
        <button class="icon-btn" data-action="open-settings" title="Pengaturan Sistem">
          ⚙️
        </button>
      </div>
    </header>

    <main id="screen-container"></main>

    <nav>
      <button class="nav-btn active" data-tab="home"><span class="ico">🏠</span>Beranda</button>
      <button class="nav-btn" data-tab="report"><span class="ico">📊</span>Laporan</button>
      <button class="fab" data-action="open-add">+</button>
      <button class="nav-btn" data-tab="budget"><span class="ico">🎯</span>Budget</button>
      <button class="nav-btn" data-tab="notes"><span class="ico">📝</span>Catatan</button>
    </nav>
  </div>

  <!-- MODAL TAMBAH TRANSAKSI -->
  <div id="modal-add" class="modal-backdrop">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="seg-tabs" style="flex:1; margin-right:10px;">
          <button class="seg-btn active" data-tx-tab="expense">Pengeluaran</button>
          <button class="seg-btn" data-tx-tab="income">Pemasukan</button>
          <button class="seg-btn" data-tx-tab="transfer">Transfer</button>
        </div>
        <button class="icon-btn" data-action="close-modals">✕</button>
      </div>
      <div id="modal-add-body"></div>
    </div>
  </div>

  <!-- MODAL GENERIC -->
  <div id="modal-generic" class="modal-backdrop" style="align-items:center; padding:16px;">
    <div id="modal-generic-box" class="modal-box" style="border-radius:22px; max-width:395px;"></div>
  </div>

  <script>
    const STORAGE_KEY = 'finos_html_v5_dual';
    const LEGACY_KEY = 'finos_html_v4_clean';
    const DEFAULT_EXPENSE_CATS = ['Makan & Minum', 'Transportasi', 'Belanja Online', 'Tagihan & Pulsa', 'Hiburan', 'Kesehatan', 'Lainnya'];
    const INCOME_CATS = ['Gaji & Uang Saku', 'Bonus & Hadiah', 'Investasi', 'Lainnya'];
    const PERIOD_KEYS = ['daily', 'weekly', 'monthly', 'yearly', 'custom'];
    const CHART_COLORS = ['#10b981', '#38bdf8', '#f59e0b', '#f43f5e', '#a78bfa', '#ec4899', '#14b8a6', '#eab308', '#6366f1'];
    const MONTH_NAMES = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const MONTH_NAMES_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

    const nowInit = new Date();
    const todayStr = nowInit.toISOString().slice(0, 10);
    const firstDayMonth = todayStr.slice(0, 8) + '01';
    const firstDayYear = todayStr.slice(0, 4) + '-01-01';

    function makeEmptyPeriodConfig(start, end) {
      return {
        customStart: start,
        customEnd: end,
        includedWalletIds: [],
        allocations: {}
      };
    }

    const EMPTY_STATE = {
      settings: {
        autoTrackingEnabled: true,
        autoEnabledAt: new Date(Date.now() - 86400000).toISOString(),
        hideBalance: false,
        enableBudgetZoneA: true,
        enableBudgetZoneB: true,
        themeMode: 'dark' // 'dark' | 'light' | 'system'
      },
      wallets: [],
      transactions: [],
      unparsedLogs: [],
      noteClusters: [],
      notes: [],
      savingsGoals: [],
      customExpenseCats: [],
      activeBudgetPeriod: 'monthly',
      budgetsByPeriod: {
        daily: makeEmptyPeriodConfig(todayStr, todayStr),
        weekly: makeEmptyPeriodConfig(todayStr, todayStr),
        monthly: makeEmptyPeriodConfig(firstDayMonth, todayStr),
        yearly: makeEmptyPeriodConfig(firstDayYear, todayStr),
        custom: makeEmptyPeriodConfig(firstDayMonth, todayStr)
      }
    };

    function hydrateState(parsed) {
      const base = JSON.parse(JSON.stringify(EMPTY_STATE));
      return {
        ...base,
        ...parsed,
        settings: {
          ...base.settings,
          ...(parsed.settings || {}),
          enableBudgetZoneA: parsed.settings?.enableBudgetZoneA ?? true,
          enableBudgetZoneB: parsed.settings?.enableBudgetZoneB ?? true,
          themeMode: parsed.settings?.themeMode || 'dark'
        },
        noteClusters: Array.isArray(parsed.noteClusters) ? parsed.noteClusters : [],
        notes: Array.isArray(parsed.notes) ? parsed.notes : [],
        savingsGoals: Array.isArray(parsed.savingsGoals) ? parsed.savingsGoals : [],
        customExpenseCats: Array.isArray(parsed.customExpenseCats) ? parsed.customExpenseCats : []
      };
    }

    function loadInitialState() {
      const rawV5 = localStorage.getItem(STORAGE_KEY);
      if (rawV5) {
        try { return hydrateState(JSON.parse(rawV5)); } catch (e) {}
      }
      const rawV4 = localStorage.getItem(LEGACY_KEY);
      if (rawV4) {
        try { return hydrateState(JSON.parse(rawV4)); } catch (e) {}
      }
      return JSON.parse(JSON.stringify(EMPTY_STATE));
    }

    let state = loadInitialState();

    // Theme Engine (Dark Mode, Light Mode, System Default)
    const systemLightMedia = window.matchMedia('(prefers-color-scheme: light)');
    function applyTheme() {
      const mode = state.settings.themeMode || 'dark';
      const resolved = mode === 'system' ? (systemLightMedia.matches ? 'light' : 'dark') : mode;
      document.documentElement.setAttribute('data-theme', resolved);
      const metaTheme = document.getElementById('meta-theme-color');
      if (metaTheme) metaTheme.setAttribute('content', resolved === 'light' ? '#f8fafc' : '#020617');
    }
    systemLightMedia.addEventListener('change', () => {
      if ((state.settings.themeMode || 'dark') === 'system') applyTheme();
    });
    applyTheme();

    function getExpenseCategories() {
      const set = new Set([...DEFAULT_EXPENSE_CATS, ...(state.customExpenseCats || [])]);
      PERIOD_KEYS.forEach(pk => {
        const allocs = state.budgetsByPeriod[pk]?.allocations || {};
        Object.keys(allocs).forEach(k => set.add(k));
      });
      const arr = Array.from(set).filter(c => c !== 'Lainnya');
      arr.push('Lainnya');
      return arr;
    }

    let clusterEditMode = { bank: false, ewallet: false, cash: false, invest: false };

    let activeTab = 'home';
    let reportSubTab = 'history';
    let historyTypeFilter = 'ALL';
    let historyWalletFilter = 'ALL';
    let notesStatusFilter = 'ALL';

    // State Sub-Tab Grafik
    let chartType = 'expense';
    let periodFilter = 'month';
    let chartSelectedMonth = nowInit.getMonth();
    let chartSelectedYear = nowInit.getFullYear();
    let chartCustomStart = firstDayMonth;
    let chartCustomEnd = todayStr;
    let walletFilter = 'ALL';
    let chartViewMode = 'donut';
    let drilldownCat = null;

    let modalTxType = 'expense';
    let selectedCategory = DEFAULT_EXPENSE_CATS[0];
    let preselectTransferToId = null;

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2900);
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      applyTheme();
      renderAll();
    }

    function rp(num) {
      if (state.settings.hideBalance) return 'Rp •••••••';
      return (num < 0 ? '-' : '') + 'Rp ' + Math.abs(Math.round(num)).toLocaleString('id-ID');
    }

    function rpCompact(num) {
      if (state.settings.hideBalance) return '•••';
      const abs = Math.abs(num);
      if (abs >= 1000000) return (abs / 1000000).toFixed(1).replace('.0', '') + 'jt';
      if (abs >= 1000) return Math.round(abs / 1000) + 'rb';
      return String(abs);
    }

    function esc(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function formatTimeShort(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }) + ' ' +
             d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

    function getDueBadgeInfo(dueDateStr, isDone) {
      if (!dueDateStr) return null;
      const today = new Date().toISOString().slice(0, 10);
      if (isDone) return { cls: 'due-normal', label: '📅 ' + dueDateStr };
      if (dueDateStr < today) return { cls: 'due-over', label: '⚠️ Lewat: ' + dueDateStr };
      if (dueDateStr === today) return { cls: 'due-soon', label: '⏰ Hari Ini: ' + dueDateStr };
      return { cls: 'due-normal', label: '📅 Target: ' + dueDateStr };
    }

    function applyWalletEffect(tx, reverse = false) {
      const m = reverse ? -1 : 1;
      state.wallets = state.wallets.map(w => {
        if (tx.type === 'income' && w.id === tx.walletId) return { ...w, balance: w.balance + tx.amount * m };
        if (tx.type === 'expense' && w.id === tx.walletId) return { ...w, balance: w.balance - tx.amount * m };
        if (tx.type === 'sync' && w.id === tx.walletId) return { ...w, balance: w.balance + tx.syncDiff * m };
        if (tx.type === 'transfer') {
          if (w.id === tx.walletId) return { ...w, balance: w.balance - tx.amount * m };
          if (w.id === tx.targetWalletId) return { ...w, balance: w.balance + tx.amount * m };
        }
        return w;
      });
    }

    function autoCategory(text) {
      const l = text.toLowerCase();
      const customMatch = (state.customExpenseCats || []).find(c => l.includes(c.toLowerCase()));
      if (customMatch) return customMatch;

      if (/(kopi|warung|makan|nasi|mie|ayam|teh|gofood|indomaret|alfamart|minum|es )/.test(l)) return 'Makan & Minum';
      if (/(gojek|grab|bensin|parkir|tol|kereta)/.test(l)) return 'Transportasi';
      if (/(shopee|tokopedia|lazada|tiktok)/.test(l)) return 'Belanja Online';
      if (/(pln|listrik|pulsa|paket|wifi|pdam)/.test(l)) return 'Tagihan & Pulsa';
      if (/(obat|apotek|klinik|dokter)/.test(l)) return 'Kesehatan';
      return 'Lainnya';
    }

    function getBudgetUsageStatus(spent, limit) {
      if (limit <= 0) {
        return { text: 'Belum diatur', color: 'var(--muted)', barColor: 'var(--green)', pct: 0 };
      }
      const pct = (spent / limit) * 100;
      if (spent > limit) {
        return { text: `Melebihi ${rp(spent - limit)}`, color: 'var(--red)', barColor: 'var(--red)', pct: 100 };
      }
      if (spent === limit) {
        return { text: 'Habis (100% Terpakai)', color: 'var(--amber)', barColor: 'var(--amber)', pct: 100 };
      }
      const isWarning = pct >= 75;
      return {
        text: `Sisa ${rp(limit - spent)}`,
        color: isWarning ? 'var(--text-amber)' : 'var(--text-green)',
        barColor: isWarning ? 'var(--amber)' : 'var(--green)',
        pct
      };
    }

    function isTxInPeriod(tx, periodKey, cfg) {
      const txDate = new Date(tx.createdAt);
      const txYmd = txDate.toISOString().slice(0, 10);
      const now = new Date();
      const nowYmd = now.toISOString().slice(0, 10);

      if (periodKey === 'daily') return txYmd === nowYmd;
      if (periodKey === 'weekly') {
        const diffDays = (now.getTime() - txDate.getTime()) / 86400000;
        return diffDays >= 0 && diffDays <= 7;
      }
      if (periodKey === 'monthly') return txDate.getMonth() === now.getMonth() && txDate.getFullYear() === now.getFullYear();
      if (periodKey === 'yearly') return txDate.getFullYear() === now.getFullYear();
      if (periodKey === 'custom') return txYmd >= cfg.customStart && txYmd <= cfg.customEnd;
      return true;
    }

    function getPeriodLabel(periodKey, cfg) {
      const map = {
        daily: 'Harian (Hari Ini)',
        weekly: 'Pekanan (7 Hari Terakhir)',
        monthly: 'Bulanan (Bulan Ini)',
        yearly: 'Tahunan (Tahun Ini)',
        custom: `Periode (${cfg.customStart} s/d ${cfg.customEnd})`
      };
      return map[periodKey] || 'Bulanan';
    }

    function getAvailableYears() {
      const curYear = new Date().getFullYear();
      const yearSet = new Set([curYear - 1, curYear, curYear + 1]);
      state.transactions.forEach(t => {
        const y = new Date(t.createdAt).getFullYear();
        if (!isNaN(y)) yearSet.add(y);
      });
      return Array.from(yearSet).sort((a, b) => b - a);
    }

    function getChartDateWindow() {
      const now = new Date();
      const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
      let start, end, prevStart, prevEnd, daysCount, label, prevLabel;

      if (periodFilter === 'week') {
        end = endOfToday;
        start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6, 0, 0, 0, 0);
        daysCount = 7;
        prevEnd = new Date(start.getTime() - 1);
        prevStart = new Date(prevEnd.getTime() - 7 * 86400000 + 1);
        label = '7 Hari Terakhir';
        prevLabel = '7 hari sblmnya';
      } else if (periodFilter === 'month') {
        const isCurrentMonth = chartSelectedYear === now.getFullYear() && chartSelectedMonth === now.getMonth();
        start = new Date(chartSelectedYear, chartSelectedMonth, 1, 0, 0, 0, 0);
        if (isCurrentMonth) {
          end = endOfToday;
          daysCount = Math.max(1, now.getDate());
        } else {
          end = new Date(chartSelectedYear, chartSelectedMonth + 1, 0, 23, 59, 59, 999);
          daysCount = end.getDate();
        }
        const prevMonthDate = new Date(chartSelectedYear, chartSelectedMonth - 1, 1);
        prevStart = new Date(prevMonthDate.getFullYear(), prevMonthDate.getMonth(), 1, 0, 0, 0, 0);
        prevEnd = new Date(prevMonthDate.getFullYear(), prevMonthDate.getMonth() + 1, 0, 23, 59, 59, 999);
        label = `${MONTH_NAMES[chartSelectedMonth]} ${chartSelectedYear}`;
        prevLabel = `${MONTH_NAMES_SHORT[prevMonthDate.getMonth()]} ${prevMonthDate.getFullYear()}`;
      } else if (periodFilter === 'year') {
        const isCurrentYear = chartSelectedYear === now.getFullYear();
        start = new Date(chartSelectedYear, 0, 1, 0, 0, 0, 0);
        if (isCurrentYear) {
          end = endOfToday;
          daysCount = Math.max(1, Math.round((end.getTime() - start.getTime() + 1) / 86400000));
        } else {
          end = new Date(chartSelectedYear, 11, 31, 23, 59, 59, 999);
          const isLeap = (chartSelectedYear % 4 === 0 && (chartSelectedYear % 100 !== 0 || chartSelectedYear % 400 === 0));
          daysCount = isLeap ? 366 : 365;
        }
        prevStart = new Date(chartSelectedYear - 1, 0, 1, 0, 0, 0, 0);
        prevEnd = new Date(chartSelectedYear - 1, 11, 31, 23, 59, 59, 999);
        label = `Tahun ${chartSelectedYear}`;
        prevLabel = `Tahun ${chartSelectedYear - 1}`;
      } else {
        const sParts = (chartCustomStart || firstDayMonth).split('-').map(Number);
        const eParts = (chartCustomEnd || todayStr).split('-').map(Number);
        start = new Date(sParts[0], sParts[1] - 1, sParts[2], 0, 0, 0, 0);
        end = new Date(eParts[0], eParts[1] - 1, eParts[2], 23, 59, 59, 999);
        if (end < start) end = new Date(start.getFullYear(), start.getMonth(), start.getDate(), 23, 59, 59, 999);
        const spanMs = end.getTime() - start.getTime() + 1;
        daysCount = Math.max(1, Math.round(spanMs / 86400000));
        prevEnd = new Date(start.getTime() - 1);
        prevStart = new Date(prevEnd.getTime() - spanMs + 1);
        label = `${chartCustomStart} s/d ${chartCustomEnd}`;
        prevLabel = 'rentang sblmnya';
      }

      return { start, end, prevStart, prevEnd, daysCount, label, prevLabel };
    }

    function processIncomingNotification(pkg, title, text) {
      if (!state.settings.autoTrackingEnabled) return showToast('Mode Auto-Track sedang OFF');
      if (state.wallets.length === 0) return showToast('Tambahkan akun Bank/E-Wallet dulu di Beranda');

      const full = `${title} ${text}`;
      if (/(otp|pin|cvv|kode verifikasi|rahasia|gagal|dibatalkan|ditolak)/i.test(full)) return;

      const amtMatch = full.match(/(?:rp\.?\s*)([\d.,]+)/i);
      if (!amtMatch) {
        state.unparsedLogs.unshift({ id: 'unp_' + Date.now(), rawText: full });
        saveState();
        showToast('Notifikasi masuk ke kotak gagal baca');
        return;
      }
      const amount = parseInt(amtMatch[1].replace(/,00$/, '').replace(/[.,]/g, ''), 10);

      if (pkg.includes('shopee') || pkg.includes('tokopedia')) {
        const existing = state.transactions.find(t => t.type === 'expense' && t.amount === amount);
        if (existing) {
          existing.title = `${title}: ${text.slice(0, 34)}`;
          saveState();
          showToast('Judul transaksi diperkaya dari notif e-commerce');
        }
        return;
      }

      if (/(transfer ke|top up|tarik tunai|bibit|reksadana)/i.test(full)) {
        const fromW = state.wallets.find(w => full.toLowerCase().includes(w.name.toLowerCase())) || state.wallets[0];
        const toW = full.toLowerCase().includes('tarik tunai')
          ? state.wallets.find(w => w.category === 'cash')
          : state.wallets.find(w => w.id !== fromW.id && full.toLowerCase().includes(w.name.toLowerCase()));
        if (fromW && toW) {
          const tx = { id: 'tx_' + Date.now(), walletId: fromW.id, targetWalletId: toW.id, type: 'transfer', amount, title: `Transfer: ${fromW.name} → ${toW.name}`, category: 'Transfer', isAuto: true, createdAt: new Date().toISOString() };
          applyWalletEffect(tx);
          state.transactions.unshift(tx);
          saveState();
          showToast('Transfer antar dompet dicatat otomatis');
          return;
        }
      }

      const wallet = state.wallets.find(w => full.toLowerCase().includes(w.name.toLowerCase())) || state.wallets[0];
      const isIncome = /(transfer masuk|menerima|uang masuk|gaji)/i.test(full);
      const merchant = full.match(/(?:\bdi\b|\bke\b)\s+([A-Za-z0-9\s.&'-]{2,26})/i);
      const txTitle = merchant ? merchant[1].trim() : (isIncome ? `Dana Masuk (${wallet.name})` : `Transaksi (${wallet.name})`);
      const autoCat = isIncome ? 'Gaji & Uang Saku' : autoCategory(txTitle);
      const tx = {
        id: 'tx_' + Date.now(),
        walletId: wallet.id,
        type: isIncome ? 'income' : 'expense',
        amount,
        title: autoCat === 'Lainnya' ? `Lainnya — ${txTitle}` : txTitle,
        category: autoCat,
        isAuto: true,
        createdAt: new Date().toISOString()
      };
      applyWalletEffect(tx);
      state.transactions.unshift(tx);
      saveState();
      showToast(`Tercatat otomatis: ${txTitle} (${rp(amount)})`);
    }

    function renderChartSection(win, windowAllFlowTxs, activeList, total, rows) {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const emptyRingStroke = isLight ? '#e2e8f0' : '#1e293b';
      const axisLineStroke = isLight ? '#cbd5e1' : '#1e293b';
      const axisLabelFill = isLight ? '#64748b' : '#94a3b8';

      if (chartViewMode === 'donut') {
        const radius = 44;
        const circumference = 2 * Math.PI * radius;
        let offsetAcc = 0;

        const segmentsSvg = rows.length === 0
          ? `<circle cx="60" cy="60" r="${radius}" fill="none" stroke="${emptyRingStroke}" stroke-width="14" />`
          : rows.map(([cat, amt], idx) => {
              const pct = total > 0 ? amt / total : 0;
              const segLen = pct * circumference;
              const color = CHART_COLORS[idx % CHART_COLORS.length];
              const el = `<circle cx="60" cy="60" r="${radius}" fill="none" stroke="${color}" stroke-width="14"
                stroke-dasharray="${segLen} ${circumference}"
                stroke-dashoffset="${-offsetAcc}"
                transform="rotate(-90 60 60)" />`;
              offsetAcc += segLen;
              return el;
            }).join('');

        const drillTxs = drilldownCat ? activeList.filter(t => t.category === drilldownCat) : [];

        return `
          <div class="card">
            <div class="donut-wrap">
              <div class="donut-box">
                <svg viewBox="0 0 120 120" width="118" height="118">${segmentsSvg}</svg>
                <div class="donut-center">
                  <span style="font-size:9px; color:var(--muted); text-transform:uppercase;">${chartType === 'expense' ? 'Keluar' : 'Masuk'}</span>
                  <b style="font-size:12px; margin-top:2px;">${rpCompact(total)}</b>
                  <span style="font-size:9px; color:var(--muted);">${activeList.length} tx</span>
                </div>
              </div>
              <div style="flex:1; min-width:0;">
                <span class="label-xs">Ringkasan • ${esc(win.label)}</span>
                <div style="font-size:17px; font-weight:800; margin:4px 0;">${rp(total)}</div>
                <p style="font-size:11px; color:var(--muted); line-height:1.35;">
                  ${rows.length === 0 ? 'Belum ada transaksi arus kas pada waktu terpilih.' : 'Ketuk kategori di bawah untuk melihat rincian transaksinya.'}
                </p>
              </div>
            </div>

            ${rows.length > 0 ? `
              <div style="display:flex; flex-direction:column; gap:4px; border-top:1px solid var(--border); padding-top:10px;">
                ${rows.map(([cat, amt], idx) => {
                  const pct = total > 0 ? (amt / total) * 100 : 0;
                  const color = CHART_COLORS[idx % CHART_COLORS.length];
                  const isOpen = drilldownCat === cat;
                  return `
                    <div>
                      <button class="cat-row-btn ${isOpen ? 'active' : ''}" data-action="drill-cat" data-cat="${esc(cat)}">
                        <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px;">
                          <span style="display:flex; align-items:center; gap:6px;">
                            <span style="width:9px; height:9px; border-radius:3px; background:${color}; display:inline-block;"></span>
                            <b>${esc(cat)}</b>
                          </span>
                          <span><b>${rp(amt)}</b> <span style="color:var(--muted); font-size:11px;">(${pct.toFixed(1)}%) ${isOpen ? '▴' : '▾'}</span></span>
                        </div>
                        <div class="bar-bg" style="margin-bottom:2px;"><div class="bar-fill" style="width:${pct}%; background:${color};"></div></div>
                      </button>
                      ${isOpen ? `
                        <div class="drill-box">
                          <div style="font-size:10px; color:var(--muted); font-weight:700; margin-bottom:6px;">RINCIAN ${esc(cat).toUpperCase()} (${drillTxs.length} TRANSAKSI)</div>
                          ${drillTxs.map(tx => {
                            const w = state.wallets.find(x => x.id === tx.walletId);
                            return `
                              <div style="display:flex; justify-content:space-between; font-size:11px; padding:4px 0; border-bottom:1px solid var(--border);">
                                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:65%;">${esc(tx.title)} <span style="color:var(--muted);">(${esc(w ? w.name : '-')})</span></span>
                                <b>${rp(tx.amount)}</b>
                              </div>
                            `;
                          }).join('')}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }

      if (chartViewMode === 'trend') {
        const buckets = [];
        if (periodFilter === 'year') {
          const yr = chartSelectedYear;
          for (let m = 0; m < 12; m++) {
            const bTxs = windowAllFlowTxs.filter(t => {
              const d = new Date(t.createdAt);
              return d.getFullYear() === yr && d.getMonth() === m;
            });
            buckets.push({
              label: MONTH_NAMES_SHORT[m],
              inc: bTxs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0),
              exp: bTxs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0)
            });
          }
        } else {
          const maxBars = Math.min(win.daysCount, 12);
          const stepMs = (win.end.getTime() - win.start.getTime() + 1) / maxBars;
          for (let i = 0; i < maxBars; i++) {
            const bStart = win.start.getTime() + i * stepMs;
            const bEnd = bStart + stepMs - 1;
            const dObj = new Date(bStart);
            const lbl = `${dObj.getDate()}/${dObj.getMonth() + 1}`;
            const bTxs = windowAllFlowTxs.filter(t => {
              const ts = new Date(t.createdAt).getTime();
              return ts >= bStart && ts <= bEnd;
            });
            buckets.push({
              label: lbl,
              inc: bTxs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0),
              exp: bTxs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0)
            });
          }
        }

        const maxVal = Math.max(1, ...buckets.map(b => Math.max(b.inc, b.exp)));
        const svgW = 360;
        const svgH = 145;
        const chartH = 112;
        const slotW = svgW / buckets.length;

        const barsSvg = buckets.map((b, i) => {
          const xBase = i * slotW + slotW * 0.16;
          const barW = Math.max(4, slotW * 0.3);
          const incH = (b.inc / maxVal) * chartH;
          const expH = (b.exp / maxVal) * chartH;
          return `
            <rect x="${xBase}" y="${chartH - incH + 6}" width="${barW}" height="${Math.max(incH, b.inc > 0 ? 3 : 0)}" rx="2" fill="#10b981" />
            <rect x="${xBase + barW + 2}" y="${chartH - expH + 6}" width="${barW}" height="${Math.max(expH, b.exp > 0 ? 3 : 0)}" rx="2" fill="#f43f5e" />
            <text x="${i * slotW + slotW / 2}" y="${svgH - 4}" text-anchor="middle" fill="${axisLabelFill}" font-size="9">${b.label}</text>
          `;
        }).join('');

        const totalIncWin = windowAllFlowTxs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
        const totalExpWin = windowAllFlowTxs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);

        return `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <span class="label-xs">Tren Arus Kas • ${esc(win.label)}</span>
              <div style="display:flex; gap:10px; font-size:10px; font-weight:700;">
                <span style="color:var(--green);">■ Masuk</span>
                <span style="color:var(--red);">■ Keluar</span>
              </div>
            </div>

            <div style="background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:10px 6px 4px; overflow-x:auto;">
              <svg viewBox="0 0 ${svgW} ${svgH}" width="100%" height="150">
                <line x1="0" y1="${chartH + 6}" x2="${svgW}" y2="${chartH + 6}" stroke="${axisLineStroke}" stroke-width="1" />
                ${barsSvg}
              </svg>
            </div>

            <div class="grid-3" style="margin-top:12px;">
              <div><span style="color:var(--muted)">Total Masuk</span><b style="color:var(--green)">${rp(totalIncWin)}</b></div>
              <div><span style="color:var(--muted)">Total Keluar</span><b style="color:var(--red)">${rp(totalExpWin)}</b></div>
              <div style="text-align:right;"><span style="color:var(--muted)">Selisih</span><b style="color:${totalIncWin - totalExpWin >= 0 ? 'var(--green)' : 'var(--red)'}">${rp(totalIncWin - totalExpWin)}</b></div>
            </div>
          </div>
        `;
      }

      const clusterMap = {
        bank: { label: 'Bank', count: 0, amt: 0 },
        ewallet: { label: 'E-Wallet', count: 0, amt: 0 },
        cash: { label: 'Fisik / Cash', count: 0, amt: 0 },
        invest: { label: 'Investasi & Tabungan', count: 0, amt: 0 }
      };
      activeList.forEach(t => {
        const w = state.wallets.find(x => x.id === t.walletId);
        const key = w ? w.category : 'cash';
        if (clusterMap[key]) {
          clusterMap[key].count += 1;
          clusterMap[key].amt += t.amount;
        }
      });
      const clusterRows = Object.values(clusterMap).filter(c => c.count > 0).sort((a, b) => b.amt - a.amt);

      return `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span class="label-xs">Tabel Kategori • ${esc(win.label)}</span>
            <b style="font-size:12px;">${rp(total)}</b>
          </div>
          ${rows.length === 0 ? '<p style="font-size:12px; color:var(--muted); text-align:center; padding:16px 0;">Belum ada data pada waktu terpilih.</p>' : `
            <table class="data-table">
              <thead>
                <tr>
                  <th>Kategori</th>
                  <th class="num-col">Tx</th>
                  <th class="num-col">Nominal</th>
                  <th class="num-col">Porsi</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(([cat, amt]) => {
                  const cnt = activeList.filter(t => t.category === cat).length;
                  const pct = total > 0 ? (amt / total) * 100 : 0;
                  return `
                    <tr>
                      <td><b>${esc(cat)}</b></td>
                      <td class="num-col" style="color:var(--muted);">${cnt}x</td>
                      <td class="num-col"><b>${rp(amt)}</b></td>
                      <td class="num-col" style="color:var(--text-green);">${pct.toFixed(1)}%</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          `}
        </div>

        <div class="card">
          <div style="margin-bottom:8px;">
            <span class="label-xs">Tabel Distribusi per Kluster Dompet</span>
          </div>
          ${clusterRows.length === 0 ? '<p style="font-size:12px; color:var(--muted); text-align:center; padding:12px 0;">Belum ada data kanal dompet.</p>' : `
            <table class="data-table">
              <thead>
                <tr>
                  <th>Kluster Saldo</th>
                  <th class="num-col">Tx</th>
                  <th class="num-col">Total</th>
                  <th class="num-col">Porsi</th>
                </tr>
              </thead>
              <tbody>
                ${clusterRows.map(c => {
                  const pct = total > 0 ? (c.amt / total) * 100 : 0;
                  return `
                    <tr>
                      <td><b>${esc(c.label)}</b></td>
                      <td class="num-col" style="color:var(--muted);">${c.count}x</td>
                      <td class="num-col"><b>${rp(c.amt)}</b></td>
                      <td class="num-col" style="color:var(--text-blue);">${pct.toFixed(1)}%</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          `}
        </div>
      `;
    }

                        <span>${formatTimeShort(tx.createdAt)}</span>

                  </div>

        } else {
          const win = getChartDateWindow();
          const availYears = getAvailableYears();

          const windowAllFlowTxs = state.transactions.filter(t => {
            if (t.type !== 'expense' && t.type !== 'income') return false;
            if (walletFilter !== 'ALL' && t.walletId !== walletFilter) return false;
            const ts = new Date(t.createdAt).getTime();
            return ts >= win.start.getTime() && ts <= win.end.getTime();
          });

          const activeList = windowAllFlowTxs.filter(t => t.type === chartType);
          const total = activeList.reduce((s, t) => s + t.amount, 0);
          const dailyAvg = total / win.daysCount;

          const prevTotal = state.transactions
            .filter(t => {
              if (t.type !== chartType) return false;
              if (walletFilter !== 'ALL' && t.walletId !== walletFilter) return false;
              const ts = new Date(t.createdAt).getTime();
              return ts >= win.prevStart.getTime() && ts <= win.prevEnd.getTime();
            })
            .reduce((s, t) => s + t.amount, 0);

          let compBadgeClass = 'trend-neutral';
          let compText = 'Sama vs ' + win.prevLabel;
          if (prevTotal === 0 && total > 0) {
            compBadgeClass = chartType === 'expense' ? 'trend-bad' : 'trend-good';
            compText = `Baru (${win.prevLabel}: Rp 0)`;
          } else if (prevTotal > 0) {
            const diffPct = ((total - prevTotal) / prevTotal) * 100;
            if (Math.abs(diffPct) < 0.5) {
              compText = `Stabil vs ${win.prevLabel}`;
            } else if (chartType === 'expense') {
              compBadgeClass = diffPct < 0 ? 'trend-good' : 'trend-bad';
              compText = diffPct < 0
                ? `↓ ${Math.abs(diffPct).toFixed(1)}% lebih hemat`
                : `↑ ${diffPct.toFixed(1)}% lebih boros`;
            } else {
              compBadgeClass = diffPct > 0 ? 'trend-good' : 'trend-bad';
              compText = diffPct > 0
                ? `↑ ${diffPct.toFixed(1)}% naik`
                : `↓ ${Math.abs(diffPct).toFixed(1)}% turun`;
            }
          }

          const byCat = {};
          activeList.forEach(t => { byCat[t.category] = (byCat[t.category] || 0) + t.amount; });
          const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

          container.innerHTML = `
            ${subSwitchHtml}

            <div class="seg-tabs">
              <button class="seg-btn ${chartType === 'expense' ? 'active-sub' : ''}" data-action="chart-type" data-val="expense">Pengeluaran</button>
              <button class="seg-btn ${chartType === 'income' ? 'active-sub' : ''}" data-action="chart-type" data-val="income">Pemasukan</button>
            </div>

            <div style="display:flex; gap:8px;">
              <div class="seg-tabs" style="flex:1;">
                ${[['week','7 Hari'],['month','Per Bulan'],['year','Per Tahun'],['custom','Tanggal']].map(([k,lbl]) =>
                  `<button class="seg-btn ${periodFilter === k ? 'active-sub' : ''}" data-action="period-filter" data-val="${k}">${lbl}</button>`
                ).join('')}
              </div>
              <select style="width:auto; padding:6px 8px;" data-action="wallet-filter">
                <option value="ALL">Semua Dompet</option>
                ${state.wallets.map(w => `<option value="${w.id}" ${walletFilter === w.id ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}

            </div>

            ${periodFilter === 'month' ? `
              <div class="time-picker-bar">

                  <select style="width:auto; min-width:80px;" data-action="chart-select-year">
                    ${availYears.map(y => `<option value="${y}" ${chartSelectedYear === y ? 'selected' : ''}>${y}</option>`).join('')}
                  </select>
                </div>
              </div>

            ${periodFilter === 'year' ? `

                ).join('')}
              </div>
            </div>

            ${renderChartSection(win, windowAllFlowTxs, activeList, total, rows)}
          `;
        }
      }

      // 3. TAB BUDGET (MODULAR: ZONA A & ZONA B BISA DI ON/OFF DI PENGATURAN)
      if (activeTab === 'budget') {
        const pKey = state.activeBudgetPeriod;
        const pCfg = state.budgetsByPeriod[pKey];
        const showZoneA = state.settings.enableBudgetZoneA !== false;
        const showZoneB = state.settings.enableBudgetZoneB !== false;

        // --- Hitung Zona A ---
        const goals = state.savingsGoals || [];
        const totalSavedAssets = goals.reduce((sum, g) => {

          return sum + (w ? Math.max(0, w.balance) : 0);

        const totalPeriodSavingsIn = goals.reduce((sum, g) => {

                  const isLockedGoal = g.mode === 'GOAL_LOCKED';
                  const targetAmt = isLockedGoal ? (g.targetAmount || 1) : 0;
                  const pct = isLockedGoal ? Math.min(100, Math.max(0, (curBal / targetAmt) * 100)) : 0;
                  const isReadyToBuy = isLockedGoal && !g.isCompleted && curBal >= targetAmt;

                  return `
                    <div class="goal-card ${isReadyToBuy || g.isCompleted ? 'achieved' : ''}">
                      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:6px;">
                        <div style="min-width:0;">
                          <div style="display:flex; align-items:center; gap:5px; flex-wrap:wrap;">
                            <b style="font-size:12.5px;">${esc(g.name)}</b>
                            <span style="font-size:9.5px; padding:1px 6px; border-radius:5px; font-weight:700; background:${isLockedGoal ? 'var(--amber-soft)' : 'var(--blue-soft)'}; color:${isLockedGoal ? 'var(--text-amber)' : 'var(--text-blue)'};">
                              ${isLockedGoal ? '🔒 Target Terkunci' : '♾️ Akumulasi Bebas'}
                            </span>
                            ${g.isCompleted ? `<span style="font-size:9.5px; padding:1px 6px; border-radius:5px; font-weight:700; background:var(--green-soft); color:var(--text-green);">✓ Terealisasi</span>` : ''}
                          </div>
                          <span style="display:block; font-size:10.5px; color:var(--muted); margin-top:2px;">
                            Dompet: <b>${w ? esc(w.name) : 'Terhapus'}</b>${g.note ? ' • ' + esc(g.note) : ''}

                        </div>
                        <div style="display:flex; align-items:center; gap:2px; flex-shrink:0;">
                          ${w && !g.isCompleted ? `<button class="btn-secondary" style="padding:4px 7px; font-size:10px; color:var(--text-blue); border-color:rgba(56,189,248,0.45);" data-action="quick-setor-goal" data-wid="${w.id}" title="Transfer dana ke kantong ini">↗ Setor</button>` : ''}
                          <button class="act-icon" data-action="open-goal-modal" data-gid="${g.id}" title="Edit kantong">✎</button>
                          <button class="act-icon del" data-action="delete-goal" data-gid="${g.id}" title="Hapus kantong">🗑</button>

                      </div>

                      ${isLockedGoal ? `
                        <div class="bar-bg" style="margin:8px 0 6px;">

                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px;">
                          <span>Terkumpul: <b style="color:${isReadyToBuy ? 'var(--text-green)' : 'var(--text)'};">${rp(curBal)}</b> <span style="color:var(--muted);">(${pct.toFixed(0)}%)</span></span>

                    </div>

        const zoneBHtml = showZoneB ? `

                    <div style="background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:11px 12px;">
