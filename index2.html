                              ${dueInfo ? `<span class="note-due ${dueInfo.cls}">${dueInfo.label}</span>` : ''}
                              ${hasLinkedTx ? `<span class="tx-synced-tag">✓ Tercatat di Dompet</span>` : ''}
                            </div>
                          </div>
                          <div style="display:flex; align-items:center; gap:1px; flex-shrink:0;">
                            ${!linkedWallet && n.amount > 0 && !n.isDone ? `<button class="act-icon" title="Bayar / catat ke dompet" data-action="realize-note" data-nid="${n.id}">💸</button>` : ''}
                            <button class="act-icon" title="Edit catatan" data-action="edit-note" data-nid="${n.id}">✎</button>
                            <button class="act-icon del" title="Hapus catatan" data-action="delete-note" data-nid="${n.id}">🗑</button>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                `}
              </div>
            `;
          }).join('')}
        `;
      }
    }

    // Modal Buat / Edit Kluster Catatan (Visual Mode Cards & Chip Selector — Tanpa Dropdown)
    function openNoteClusterModal(editClusterId = null) {
      const existing = editClusterId ? state.noteClusters.find(c => c.id === editClusterId) : null;
      const box = document.getElementById('modal-generic-box');

      let mode = (existing && existing.linkedWalletId) ? 'wallet' : 'standalone';
      let selectedWalletId = existing ? (existing.linkedWalletId || (state.wallets[0]?.id || '')) : (state.wallets[0]?.id || '');
      let selectedTxType = existing ? (existing.linkedTxType || 'expense') : 'expense';
      let selectedCat = existing ? (existing.linkedCategory || '') : '';

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b style="font-size:14px;">${existing ? '✎ Pengaturan Kluster' : '+ Buat Kluster Catatan Baru'}</b>
          <button class="act-icon" data-action="close-modals">✕</button>
        </div>

        <div>
          <span class="label-xs">1. Nama Kluster</span>
          <input id="nc-name-inp" type="text" value="${existing ? esc(existing.name) : ''}" placeholder="Contoh: Belanja Rakit PC, Hutang, Paylater..." style="margin-top:4px;" />
          ${!existing ? `
            <div class="suggest-chips">
              ${['Daftar Belanja', 'Hutang & Piutang', 'Wishlist Barang', 'Cicilan Paylater'].map(s =>
                `<button type="button" class="suggest-chip" data-action="fill-nc-name" data-val="${s}">+ ${s}</button>`
              ).join('')}
            </div>
          ` : ''}
        </div>

        <div>
          <span class="label-xs">2. Mode Hubungan Dompet</span>
          <div class="mode-cards">
            <button type="button" id="mode-btn-standalone" class="mode-card">
              <span class="mode-card-title">📋 Catatan Mandiri</span>
              <span class="mode-card-desc">Hanya daftar catatan biasa, tidak mengubah saldo dompet.</span>
            </button>
            <button type="button" id="mode-btn-wallet" class="mode-card">
              <span class="mode-card-title">🔗 Integrasi Dompet</span>
              <span class="mode-card-desc">Centang item otomatis potong / tambah saldo dompet.</span>
            </button>
          </div>
        </div>

        <div id="nc-integration-panel" style="display:none; background:var(--bg); border:1px solid rgba(56,189,248,0.3); border-radius:14px; padding:11px; flex-direction:column; gap:11px;"></div>

        <div style="display:flex; gap:8px;">
          <button type="button" class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
          <button type="button" id="save-nc-btn" class="btn-primary" style="flex:1;">${existing ? 'Simpan Perubahan' : 'Buat Kluster'}</button>
        </div>
      `;

      const btnStand = document.getElementById('mode-btn-standalone');
      const btnWallet = document.getElementById('mode-btn-wallet');
      const panel = document.getElementById('nc-integration-panel');

      function renderIntegrationPanel() {
        btnStand.className = 'mode-card' + (mode === 'standalone' ? ' active-stand' : '');
        btnWallet.className = 'mode-card' + (mode === 'wallet' ? ' active-link' : '');

        if (mode === 'standalone') {
          panel.style.display = 'none';
          return;
        }

        panel.style.display = 'flex';
        if (state.wallets.length > 0 && !state.wallets.some(w => w.id === selectedWalletId)) {
          selectedWalletId = state.wallets[0].id;
        }

        const catList = selectedTxType === 'income' ? INCOME_CATS : EXPENSE_CATS;
        if (selectedCat && !catList.includes(selectedCat)) selectedCat = '';

        panel.innerHTML = `
          <div>
            <span class="label-xs" style="color:#7dd3fc;">A. Pilih Dompet Target</span>
            ${state.wallets.length === 0 ? `
              <div style="margin-top:6px; background:var(--surface); border:1px dashed #475569; border-radius:11px; padding:10px;">
                <p style="font-size:11px; color:var(--muted); margin-bottom:8px; line-height:1.4;">
                  Kamu belum punya dompet di Beranda. Buat dompet cepat di sini agar kluster bisa langsung dihubungkan:
                </p>
                <div style="display:grid; grid-template-columns:1.2fr 1fr; gap:6px; margin-bottom:6px;">
                  <input id="quick-w-name" type="text" placeholder="Nama (mis. GoPay / BCA)" style="padding:7px 9px; font-size:11px;" />
                  <input id="quick-w-bal" type="number" placeholder="Saldo awal (Rp)" style="padding:7px 9px; font-size:11px;" />
                </div>
                <div style="display:flex; gap:6px;">
                  <select id="quick-w-cat" style="padding:6px 8px; font-size:11px; flex:1;">
                    <option value="ewallet">E-Wallet</option>
                    <option value="bank">Bank</option>
                    <option value="cash">Fisik / Cash</option>
                  </select>
                  <button type="button" id="quick-w-create-btn" class="btn-primary" style="padding:6px 10px; font-size:11px;">+ Buat & Pilih</button>
                </div>
              </div>
            ` : `
              <div class="wallet-pick-grid">
                ${state.wallets.map(w => `
                  <button type="button" class="wallet-pick-btn ${selectedWalletId === w.id ? 'selected' : ''}" data-pick-wid="${w.id}">
                    <span class="wallet-pick-name">${selectedWalletId === w.id ? '✓ ' : ''}${esc(w.name)}</span>
                    <span class="wallet-pick-bal">${rp(w.balance)}</span>
                  </button>
                `).join('')}
              </div>
            `}
          </div>

          <div>
            <span class="label-xs" style="color:#7dd3fc;">B. Efek Saat Item Dicentang</span>
            <div class="flow-toggle-grid">
              <button type="button" id="flow-exp-btn" class="flow-toggle-btn ${selectedTxType === 'expense' ? 'active-exp' : ''}">
                📤 Pengeluaran (- Saldo)
              </button>
              <button type="button" id="flow-inc-btn" class="flow-toggle-btn ${selectedTxType === 'income' ? 'active-inc' : ''}">
                📥 Pemasukan (+ Saldo)
              </button>
            </div>
          </div>

          <div>
            <span class="label-xs" style="color:#7dd3fc;">C. Kategori Transaksi</span>
            <div class="mini-chip-wrap">
              <button type="button" class="mini-chip ${selectedCat === '' ? 'selected' : ''}" data-pick-nc-cat="">✨ Otomatis</button>
              ${catList.map(c => `
                <button type="button" class="mini-chip ${selectedCat === c ? 'selected' : ''}" data-pick-nc-cat="${c}">${c}</button>
              `).join('')}
            </div>
          </div>
        `;

        // Bind events inside panel
        const qwBtn = document.getElementById('quick-w-create-btn');
        if (qwBtn) {
          qwBtn.onclick = () => {
            const wName = document.getElementById('quick-w-name').value.trim();
            const wBal = parseInt(document.getElementById('quick-w-bal').value, 10) || 0;
            const wCat = document.getElementById('quick-w-cat').value;
            if (!wName) return showToast('Isi nama dompet terlebih dahulu');
            const newId = 'w_' + Date.now();
            state.wallets.push({ id: newId, name: wName, category: wCat, balance: wBal });
            PERIOD_KEYS.forEach(pk => {
              if (!state.budgetsByPeriod[pk].includedWalletIds.includes(newId)) {
                state.budgetsByPeriod[pk].includedWalletIds.push(newId);
              }
            });
            selectedWalletId = newId;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            renderIntegrationPanel();
            showToast(`Dompet "${wName}" dibuat & terhubung`);
          };
        }

        panel.querySelectorAll('[data-pick-wid]').forEach(btn => {
          btn.onclick = () => {
            selectedWalletId = btn.dataset.pickWid;
            renderIntegrationPanel();
          };
        });

        const expBtn = document.getElementById('flow-exp-btn');
        const incBtn = document.getElementById('flow-inc-btn');
        if (expBtn) expBtn.onclick = () => { selectedTxType = 'expense'; renderIntegrationPanel(); };
        if (incBtn) incBtn.onclick = () => { selectedTxType = 'income'; renderIntegrationPanel(); };

        panel.querySelectorAll('[data-pick-nc-cat]').forEach(btn => {
          btn.onclick = () => {
            selectedCat = btn.dataset.pickNcCat;
            renderIntegrationPanel();
          };
        });
      }

      btnStand.onclick = () => { mode = 'standalone'; renderIntegrationPanel(); };
      btnWallet.onclick = () => { mode = 'wallet'; renderIntegrationPanel(); };

      renderIntegrationPanel();
      document.getElementById('modal-generic').classList.add('open');
      if (!existing) setTimeout(() => document.getElementById('nc-name-inp')?.focus(), 50);

      document.getElementById('save-nc-btn').onclick = () => {
        const name = document.getElementById('nc-name-inp').value.trim();
        if (!name) return showToast('Nama kluster tidak boleh kosong');

        if (mode === 'wallet' && !selectedWalletId) {
          return showToast('Pilih atau buat dompet terlebih dahulu untuk mode Integrasi Dompet');
        }

        const finalWalletId = mode === 'wallet' ? selectedWalletId : '';
        const finalTxType = mode === 'wallet' ? selectedTxType : 'expense';
        const finalCat = mode === 'wallet' ? selectedCat : '';

        if (existing) {
          existing.name = name;
          existing.linkedWalletId = finalWalletId;
          existing.linkedTxType = finalTxType;
          existing.linkedCategory = finalCat;
          showToast('Pengaturan kluster diperbarui');
        } else {
          state.noteClusters.push({
            id: 'nc_' + Date.now(),
            name,
            linkedWalletId: finalWalletId,
            linkedTxType: finalTxType,
            linkedCategory: finalCat
          });
          showToast(finalWalletId ? `Kluster "${name}" terhubung ke dompet` : `Kluster "${name}" dibuat`);
        }
        document.getElementById('modal-generic').classList.remove('open');
        saveState();
      };
    }

    function openNoteFormModal(clusterId, editNoteId = null) {
      const cluster = state.noteClusters.find(c => c.id === clusterId);
      if (!cluster) return;
      const existing = editNoteId ? state.notes.find(n => n.id === editNoteId) : null;
      const linkedWallet = cluster.linkedWalletId ? state.wallets.find(w => w.id === cluster.linkedWalletId) : null;
      const box = document.getElementById('modal-generic-box');

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b style="font-size:14px;">${existing ? '✎ Edit Catatan' : '+ Tambah Catatan'} • ${esc(cluster.name)}</b>
          <button class="act-icon" data-action="close-modals">✕</button>
        </div>
        ${linkedWallet ? `
          <div style="background:var(--blue-soft); border:1px solid rgba(56,189,248,0.3); border-radius:10px; padding:8px 10px; font-size:11px; color:#bae6fd;">
            🔗 Terintegrasi dengan <b>${esc(linkedWallet.name)}</b>. Saat item ini dicentang selesai, nominalnya otomatis dicatat sebagai <b>${cluster.linkedTxType === 'income' ? 'Pemasukan' : 'Pengeluaran'}</b>.
          </div>
        ` : ''}
        <div style="display:flex; flex-direction:column; gap:9px;">
          <div>
            <span class="label-xs">Judul / Nama Item</span>
            <input id="nt-title" type="text" value="${existing ? esc(existing.title) : ''}" placeholder="Contoh: Mouse Wireless, Paylater ke-2..." style="margin-top:4px;" />
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <div>
              <span class="label-xs">Nominal (Rp${linkedWallet ? '' : ', Opsional'})</span>
              <input id="nt-amount" type="number" min="0" value="${existing ? existing.amount : ''}" placeholder="0" style="margin-top:4px; font-weight:700;" />
            </div>
            <div>
              <span class="label-xs">Target / Jatuh Tempo</span>
              <input id="nt-due" type="date" value="${existing ? (existing.dueDate || '') : ''}" style="margin-top:4px;" />
            </div>
          </div>
          <div>
            <span class="label-xs">Keterangan Tambahan (Opsional)</span>
            <input id="nt-memo" type="text" value="${existing ? esc(existing.memo || '') : ''}" placeholder="Catatan detail, spesifikasi, dll..." style="margin-top:4px;" />
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
          <button id="save-nt-btn" class="btn-primary" style="flex:1;">Simpan Catatan</button>
        </div>
      `;
      document.getElementById('modal-generic').classList.add('open');
      setTimeout(() => document.getElementById('nt-title')?.focus(), 50);

      document.getElementById('save-nt-btn').onclick = () => {
        const title = document.getElementById('nt-title').value.trim();
        const amount = parseInt(document.getElementById('nt-amount').value, 10) || 0;
        const dueDate = document.getElementById('nt-due').value || '';
        const memo = document.getElementById('nt-memo').value.trim();
        if (!title) return showToast('Judul catatan wajib diisi');

        if (existing) {
          existing.title = title;
          existing.amount = amount;
          existing.dueDate = dueDate;
          existing.memo = memo;
        } else {
          state.notes.unshift({
            id: 'nt_' + Date.now(),
            clusterId: cluster.id,
            title,
            amount,
            dueDate,
            memo,
            isDone: false,
            linkedTxId: null,
            createdAt: new Date().toISOString()
          });
        }
        document.getElementById('modal-generic').classList.remove('open');
        saveState();
        showToast(existing ? 'Catatan diperbarui' : 'Catatan ditambahkan');
      };
    }

    function openRealizeNoteModal(noteId) {
      const note = state.notes.find(n => n.id === noteId);
      if (!note) return;
      if (state.wallets.length === 0) {
        return showToast('Tambahkan dompet dulu di Beranda untuk mencatat transaksi');
      }
      const cluster = state.noteClusters.find(c => c.id === note.clusterId);
      const box = document.getElementById('modal-generic-box');

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b style="font-size:14px;">💸 Realisasikan ke Transaksi</b>
          <button class="act-icon" data-action="close-modals">✕</button>
        </div>
        <p style="font-size:11px; color:var(--muted);">
          Catat <b>${esc(note.title)}</b> (${rp(note.amount)}) ke arus kas dompet dan tandai catatan ini selesai.
        </p>
        <div style="display:flex; flex-direction:column; gap:9px;">

            <span class="label-xs">Kategori Transaksi</span>
            <select id="rz-cat" style="margin-top:4px;">

        <div style="display:flex; gap:8px;">

        const txType = document.getElementById('rz-type').value;
        const wId = document.getElementById('rz-wallet').value;
        const cat = document.getElementById('rz-cat').value;
        const prefixCluster = cluster ? `[${cluster.name}] ` : '';
        const finalTitle = cat === 'Lainnya' ? `Lainnya: ${prefixCluster}${note.title}` : `${prefixCluster}${note.title}`;

        const tx = {
          id: 'tx_' + Date.now(),
          walletId: wId,
          type: txType,
          amount: note.amount,
          title: finalTitle,
          category: cat,
          isAuto: false,
          createdAt: new Date().toISOString()
        };
        applyWalletEffect(tx);
        state.transactions.unshift(tx);
        note.isDone = true;
        note.linkedTxId = tx.id;

        document.getElementById('modal-generic').classList.remove('open');
        saveState();
        showToast('Tercatat ke transaksi & catatan ditandai selesai');

    function renderAddModalBody() {
      if (state.wallets.length === 0) {
        document.getElementById('modal-add-body').innerHTML = `
          <div style="text-align:center; padding:20px 10px;">
            <p style="font-size:12px; color:var(--muted); margin-bottom:12px;">Belum ada dompet yang terdaftar. Tambahkan dompet terlebih dahulu di Beranda (klik <b>Mode Edit</b> pada kluster Bank, E-Wallet, atau Fisik).</p>
            <button class="btn-primary" data-action="close-modals">Mengerti</button>
          </div>
        `;
        return;
      }

      const cats = modalTxType === 'income' ? INCOME_CATS : EXPENSE_CATS;
      if (!cats.includes(selectedCategory)) selectedCategory = cats[0];
      const isOther = selectedCategory === 'Lainnya';
      const body = document.getElementById('modal-add-body');

      body.innerHTML = `
        <form id="full-tx-form" style="display:flex; flex-direction:column; gap:12px;">
          ${modalTxType === 'transfer' ? `
            <div style="display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; background:var(--bg); padding:10px; border-radius:14px;">
              <div><span class="label-xs">Dari</span><select id="tx-from">${state.wallets.map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div>
              <span style="color:var(--blue); font-weight:800; margin-top:12px;">→</span>
              <div><span class="label-xs">Ke</span><select id="tx-to">${state.wallets.map((w,i) => `<option value="${w.id}" ${i===1?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div>
            </div>
          ` : `
            <div>
              <span class="label-xs">Pilih Kategori</span>
              <div class="cat-grid" style="margin-top:6px;">
                ${cats.map(c => `<div class="cat-chip ${selectedCategory === c ? 'selected' : ''}" data-action="pick-cat" data-cat="${c}">${c}</div>`).join('')}
              </div>
            </div>

            ${isOther ? `
              <div class="other-box">
                <label for="tx-other-detail">⚠️ Keterangan "Lainnya" (Wajib Diisi)</label>
                <input id="tx-other-detail" type="text" required placeholder="Jelaskan transaksi ini untuk apa..." />
              </div>
            ` : ''}

            <div>
              <span class="label-xs">Dompet Sumber</span>
              <select id="tx-wallet" style="margin-top:6px;">${state.wallets.map(w => `<option value="${w.id}">${esc(w.name)} (${w.category.toUpperCase()})</option>`).join('')}</select>
            </div>
          `}
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <div><span class="label-xs">Nominal (Rp)</span><input id="tx-amount" type="number" min="1" required placeholder="15000" style="margin-top:4px; font-weight:700;" /></div>
            <div><span class="label-xs">${isOther && modalTxType !== 'transfer' ? 'Catatan Tambahan' : 'Catatan'}</span><input id="tx-note" type="text" placeholder="Opsional..." style="margin-top:4px;" /></div>
          </div>
          <button type="submit" class="btn-primary" style="width:100%; padding:12px;">Simpan Transaksi</button>
        </form>
      `;

      document.getElementById('full-tx-form').onsubmit = (e) => {
        e.preventDefault();
        const amount = parseInt(document.getElementById('tx-amount').value, 10);
        const note = document.getElementById('tx-note').value.trim();
        if (!amount || amount <= 0) return;

        if (modalTxType === 'transfer') {
          if (state.wallets.length < 2) return showToast('Minimal butuh 2 dompet untuk melakukan transfer');
          const fromId = document.getElementById('tx-from').value;
          const toId = document.getElementById('tx-to').value;
          if (fromId === toId) return showToast('Dompet asal dan tujuan harus berbeda');
          const fW = state.wallets.find(w => w.id === fromId);
          const tW = state.wallets.find(w => w.id === toId);
          const tx = { id: 'tx_' + Date.now(), walletId: fromId, targetWalletId: toId, type: 'transfer', amount, title: note || `Transfer: ${fW.name} → ${tW.name}`, category: 'Transfer', isAuto: false, createdAt: new Date().toISOString() };
          applyWalletEffect(tx);
          state.transactions.unshift(tx);
        } else {
          let finalTitle = note || selectedCategory;
          if (selectedCategory === 'Lainnya') {
            const otherDetail = document.getElementById('tx-other-detail')?.value.trim();
            if (!otherDetail) return showToast('Wajib isi keterangan untuk kategori Lainnya!');
            finalTitle = note ? `Lainnya: ${otherDetail} (${note})` : `Lainnya: ${otherDetail}`;
          }
          const wId = document.getElementById('tx-wallet').value;
          const tx = { id: 'tx_' + Date.now(), walletId: wId, type: modalTxType, amount, title: finalTitle, category: selectedCategory, isAuto: false, createdAt: new Date().toISOString() };
          applyWalletEffect(tx);
          state.transactions.unshift(tx);
        }
        document.getElementById('modal-add').classList.remove('open');
        saveState();
        showToast('Transaksi berhasil disimpan');
      };
    }

    function openEditTxModal(txId) {
      const tx = state.transactions.find(t => t.id === txId);
      if (!tx || tx.type === 'sync') return;
      const box = document.getElementById('modal-generic-box');
      const cats = tx.type === 'income' ? INCOME_CATS : tx.type === 'transfer' ? ['Transfer'] : EXPENSE_CATS;

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b style="font-size:14px;">✎ Edit Transaksi Aman</b>
          <button class="act-icon" data-action="close-modals">✕</button>
        </div>
        <p style="font-size:11px; color:var(--muted);">Perubahan nominal atau dompet akan menghitung ulang saldo secara otomatis dan memberi tanda <b>[DIEDIT]</b>.</p>

        <div>
          <span class="label-xs">Judul / Keterangan</span>
          <input id="etx-title" type="text" value="${esc(tx.title)}" style="margin-top:4px; margin-bottom:8px;" />

          <span class="label-xs">Nominal (Rp)</span>
          <input id="etx-amount" type="number" min="1" value="${tx.amount}" style="margin-top:4px; margin-bottom:8px; font-weight:700;" />

          ${tx.type !== 'transfer' ? `
            <span class="label-xs">Kategori</span>
            <select id="etx-cat" style="margin-top:4px; margin-bottom:8px;">
              ${cats.map(c => `<option value="${c}" ${tx.category === c ? 'selected' : ''}>${c}</option>`).join('')}
            </select>

            <span class="label-xs">Dompet</span>
            <select id="etx-wallet" style="margin-top:4px;">
              ${state.wallets.map(w => `<option value="${w.id}" ${tx.walletId === w.id ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}

        </div>
      `;
      document.getElementById('modal-generic').classList.add('open');

      document.getElementById('save-etx-btn').onclick = () => {
        const nextTitle = document.getElementById('etx-title').value.trim();
        const nextAmount = parseInt(document.getElementById('etx-amount').value, 10);
        if (!nextTitle || !nextAmount || nextAmount <= 0) return showToast('Judul dan nominal harus valid');

        const nextCat = tx.type !== 'transfer' ? document.getElementById('etx-cat').value : 'Transfer';
        if (nextCat === 'Lainnya' && !nextTitle.toLowerCase().includes('lainnya:')) {
          return showToast('Sertakan keterangan jelas untuk kategori Lainnya');
        }

        applyWalletEffect(tx, true);
        tx.title = nextTitle;
        tx.amount = nextAmount;
        tx.category = nextCat;
        if (tx.type !== 'transfer') {
          tx.walletId = document.getElementById('etx-wallet').value;
        }
        tx.isEdited = true;
        applyWalletEffect(tx, false);

        document.getElementById('modal-generic').classList.remove('open');
        saveState();
        showToast('Transaksi diperbarui & saldo disinkronkan');
      };
    }

      const cfg = state.budgetsByPeriod[pKey];
      const linkedBalance = state.wallets
        .filter(w => cfg.includedWalletIds.includes(w.id))
        .reduce((s, w) => s + w.balance, 0);

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b style="font-size:14px;">⚙️ Pembagian Budget • ${getPeriodLabel(pKey, cfg)}</b>
          <button class="act-icon" data-action="close-modals">✕</button>
        </div>

        <div style="background:var(--bg); padding:10px 12px; border-radius:12px; font-size:11px; display:flex; justify-content:space-between;">
          <span style="color:var(--muted);">Saldo Dompet Terhubung:</span>
          <b style="color:var(--green);">${rp(linkedBalance)}</b>
        </div>

        ${pKey === 'custom' ? `
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <div><span class="label-xs">Dari Tanggal</span><input id="cfg-start" type="date" value="${cfg.customStart}" style="margin-top:4px;" /></div>
            <div><span class="label-xs">Sampai Tanggal</span><input id="cfg-end" type="date" value="${cfg.customEnd}" style="margin-top:4px;" /></div>
          </div>
        ` : ''}

        <div style="display:flex; flex-direction:column; gap:10px;">
          <span class="label-xs">Pos Kebutuhan & Tujuan Pemakaian (Isi 0 jika tidak dipakai)</span>
          ${EXPENSE_CATS.map(cat => {
            const existing = cfg.allocations[cat] || { limit: 0, note: '' };
            return `
              <div style="background:var(--bg); border:1px solid var(--surface-2); border-radius:12px; padding:9px 10px;">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;">
                  <b style="font-size:12px; color:#e2e8f0;">${cat}</b>
                  <input class="cfg-alloc-limit" data-cat="${cat}" type="number" min="0" value="${existing.limit || 0}" placeholder="Nominal Rp" style="width:130px; padding:6px 8px; font-weight:700;" />
                </div>
                <input class="cfg-alloc-note" data-cat="${cat}" type="text" value="${esc(existing.note || '')}" placeholder="Dipakai untuk apa pada periode ini? (opsional)" style="padding:6px 8px; font-size:11px;" />
              </div>
            `;
          }).join('')}
        </div>

        <div style="display:flex; gap:8px; margin-top:4px;">
          <button class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
          <button id="save-budget-cfg" class="btn-primary" style="flex:1;">Simpan Pembagian</button>
        </div>
      `;

      document.getElementById('save-budget-cfg').onclick = () => {
        if (pKey === 'custom') {
          cfg.customStart = document.getElementById('cfg-start').value || firstDayMonth;
          cfg.customEnd = document.getElementById('cfg-end').value || todayStr;
        }
        const nextAlloc = {};
        const limitInputs = document.querySelectorAll('.cfg-alloc-limit');
        const noteInputs = document.querySelectorAll('.cfg-alloc-note');

        limitInputs.forEach((inp, idx) => {
          const cat = inp.dataset.cat;
          const lim = parseInt(inp.value, 10) || 0;
          const note = noteInputs[idx]?.value.trim() || '';
          if (lim > 0) {
            nextAlloc[cat] = { limit: lim, note };
          }
        });

        cfg.allocations = nextAlloc;
        document.getElementById('modal-generic').classList.remove('open');
        saveState();
        showToast('Pembagian budget periode disimpan');
      };

      document.getElementById('modal-generic').classList.add('open');
    }

    // Delegasi Klik Global
    document.body.addEventListener('click', (e) => {
      const tabBtn = e.target.closest('[data-tab]');
      if (tabBtn) { activeTab = tabBtn.dataset.tab; renderAll(); return; }

      const txTab = e.target.closest('[data-tx-tab]');
      if (txTab) {
        modalTxType = txTab.dataset.txTab;
        document.querySelectorAll('[data-tx-tab]').forEach(b => b.classList.toggle('active', b.dataset.txTab === modalTxType));
        renderAddModalBody();
        return;
      }

      const actEl = e.target.closest('[data-action]');
      if (!actEl) return;
      const action = actEl.dataset.action;

      if (action === 'report-sub-tab') {
        reportSubTab = actEl.dataset.val;
        renderAll();
      } else if (action === 'toggle-auto') {
        state.settings.autoTrackingEnabled = !state.settings.autoTrackingEnabled;
        if (state.settings.autoTrackingEnabled) state.settings.autoEnabledAt = new Date().toISOString();
        saveState();
      } else if (action === 'toggle-hide') {
        state.settings.hideBalance = !state.settings.hideBalance;
        saveState();
        if (document.getElementById('modal-generic').classList.contains('open')) openSystemSettingsModal();
      } else if (action === 'open-settings') {
        openSystemSettingsModal();
      } else if (action === 'toggle-cluster-edit') {
        const c = actEl.dataset.cluster;
        clusterEditMode[c] = !clusterEditMode[c];
        renderAll();
      } else if (action === 'click-wallet') {
        const cluster = actEl.dataset.cluster;
        if (!clusterEditMode[cluster]) {
          showToast('Terkunci — Klik "Mode Edit" di kluster ini untuk mengedit');
          return;
        }
        const w = state.wallets.find(x => x.id === actEl.dataset.id);
        if (!w) return;
        const box = document.getElementById('modal-generic-box');
        box.innerHTML = `
          <b style="font-size:14px;">Penyesuaian Saldo ${esc(w.name)}</b>
          <p style="font-size:11px; color:var(--muted);">Saldo saat ini: <b>${rp(w.balance)}</b>. Selisih akan dicatat sebagai <b>SYNC</b> di tab Laporan sehingga tidak mengubah angka pemasukan, pengeluaran, maupun budget.</p>
          <div>
            <span class="label-xs">Nama Dompet</span>
            <input id="edit-name-inp" type="text" value="${esc(w.name)}" style="margin-top:4px; margin-bottom:8px;" />
            <span class="label-xs">Saldo Aktual Saat Ini (Rp)</span>
            <input id="edit-bal-inp" type="number" value="${w.balance}" style="margin-top:4px; font-size:16px; font-weight:700;" />
          </div>
          <div style="display:flex; gap:8px;">
            <button class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
            <button id="save-bal-btn" class="btn-primary" style="flex:1;">Sinkronkan</button>
          </div>
        `;
        document.getElementById('modal-generic').classList.add('open');
        document.getElementById('save-bal-btn').onclick = () => {
          const nextName = document.getElementById('edit-name-inp').value.trim();
          const nextBal = parseInt(document.getElementById('edit-bal-inp').value, 10);
          if (nextName) w.name = nextName;
          if (!isNaN(nextBal)) {
            const diff = nextBal - w.balance;
            if (diff !== 0) {
              state.transactions.unshift({
                id: 'tx_sync_' + Date.now(),
                walletId: w.id,
                type: 'sync',
                syncDiff: diff,
                amount: Math.abs(diff),
                title: `Penyesuaian Saldo (${w.name})`,
                category: 'Sinkronisasi',
                isAuto: false,
                createdAt: new Date().toISOString()
              });
              w.balance = nextBal;
            }
          }
          document.getElementById('modal-generic').classList.remove('open');
          saveState();
          showToast('Saldo disinkronkan tanpa mengubah arus kas');
        };
      } else if (action === 'add-cluster-wallet') {
        const cluster = actEl.dataset.cluster;
        const label = cluster === 'bank' ? 'Bank' : cluster === 'ewallet' ? 'E-Wallet' : 'Dompet Fisik';
        const box = document.getElementById('modal-generic-box');
        box.innerHTML = `
          <b style="font-size:14px;">+ Tambah Akun ${label}</b>
          <div>
            <span class="label-xs">Nama ${label}</span>
            <input id="new-w-name" type="text" placeholder="${cluster === 'bank' ? 'Contoh: BCA / SeaBank' : cluster === 'ewallet' ? 'Contoh: GoPay / DANA' : 'Contoh: Dompet Utama'}" style="margin-top:4px; margin-bottom:8px;" />
            <span class="label-xs">Saldo Awal (Rp)</span>
            <input id="new-w-bal" type="number" value="0" style="margin-top:4px; font-weight:700;" />
          </div>
          <div style="display:flex; gap:8px;">
            <button class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
            <button id="save-new-w" class="btn-primary" style="flex:1;">Tambahkan</button>
          </div>
        `;
        document.getElementById('modal-generic').classList.add('open');
        document.getElementById('save-new-w').onclick = () => {
          const name = document.getElementById('new-w-name').value.trim();
          const bal = parseInt(document.getElementById('new-w-bal').value, 10) || 0;
          if (!name) return;
          const newId = 'w_' + Date.now();
          state.wallets.push({ id: newId, name, category: cluster, balance: bal });
          PERIOD_KEYS.forEach(pk => {
            if (!state.budgetsByPeriod[pk].includedWalletIds.includes(newId)) {
              state.budgetsByPeriod[pk].includedWalletIds.push(newId);
            }
          });
          document.getElementById('modal-generic').classList.remove('open');
          saveState();
        };
      } else if (action === 'fill-cash-amt') {
        const amtInp = document.getElementById('cash-amt-inp');
        const descInp = document.getElementById('cash-desc-inp');
        if (amtInp) amtInp.value = actEl.dataset.amt;
        if (descInp && !descInp.value.trim()) descInp.focus();
      } else if (action === 'history-type-filter') {
        historyTypeFilter = actEl.dataset.val; renderAll();
      } else if (action === 'switch-budget-period') {
        state.activeBudgetPeriod = actEl.dataset.period;
        saveState();
      } else if (action === 'toggle-budget-wallet') {
        const wid = actEl.dataset.wid;
        const pCfg = state.budgetsByPeriod[state.activeBudgetPeriod];
        if (pCfg.includedWalletIds.includes(wid)) {
          pCfg.includedWalletIds = pCfg.includedWalletIds.filter(id => id !== wid);
        } else {
          pCfg.includedWalletIds.push(wid);
        }
        saveState();
      } else if (action === 'open-budget-settings') {
        openBudgetSettingsModal();
      } else if (action === 'open-add') {
        document.getElementById('modal-add').classList.add('open');
        renderAddModalBody();
      } else if (action === 'edit-tx') {
        openEditTxModal(actEl.dataset.id);
      } else if (action === 'confirm-delete-tx') {
        const tx = state.transactions.find(t => t.id === actEl.dataset.id);
        if (!tx) return;
        const box = document.getElementById('modal-generic-box');
        box.innerHTML = `
          <b style="font-size:14px; color:var(--red);">Hapus Riwayat Ini?</b>
          <p style="font-size:12px; color:#cbd5e1;"><b>${esc(tx.title)}</b> (${rp(tx.amount)})</p>
          <p style="font-size:11px; color:var(--muted);">Saldo dompet terkait akan otomatis dikembalikan ke kondisi sebelum catatan ini dibuat.</p>
          <div style="display:flex; gap:8px;">
            <button class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
            <button id="exec-del-tx" class="btn-danger" style="flex:1;">Ya, Hapus</button>
          </div>
        `;
        document.getElementById('modal-generic').classList.add('open');
        document.getElementById('exec-del-tx').onclick = () => {
          const idx = state.transactions.findIndex(t => t.id === tx.id);
          if (idx > -1) {
            applyWalletEffect(state.transactions[idx], true);
            state.transactions.splice(idx, 1);
          }
          document.getElementById('modal-generic').classList.remove('open');
          saveState();
          showToast('Catatan dihapus & saldo dipulihkan');
        };
      } else if (action === 'close-modals') {
        document.getElementById('modal-add').classList.remove('open');
        document.getElementById('modal-generic').classList.remove('open');
      } else if (action === 'pick-cat') {
        selectedCategory = actEl.dataset.cat;
        renderAddModalBody();
      } else if (action === 'chart-type') {
        chartType = actEl.dataset.val;
        drilldownCat = null;
        renderAll();
      } else if (action === 'period-filter') {
        periodFilter = actEl.dataset.val;
        drilldownCat = null;
        renderAll();
      } else if (action === 'chart-view') {
        chartViewMode = actEl.dataset.val;
        drilldownCat = null;
        renderAll();
      } else if (action === 'drill-cat') {
        const c = actEl.dataset.cat;
        drilldownCat = drilldownCat === c ? null : c;
        renderAll();
      } else if (action === 'notes-status-filter') {
        notesStatusFilter = actEl.dataset.val;
        renderAll();
      } else if (action === 'open-note-cluster-modal') {
        openNoteClusterModal(actEl.dataset.cid || null);
      } else if (action === 'fill-nc-name') {
        const inp = document.getElementById('nc-name-inp');
        if (inp) { inp.value = actEl.dataset.val; inp.focus(); }
      } else if (action === 'delete-note-cluster') {
        const cl = state.noteClusters.find(c => c.id === actEl.dataset.cid);
        if (!cl) return;
        const count = state.notes.filter(n => n.clusterId === cl.id).length;
        const box = document.getElementById('modal-generic-box');
        box.innerHTML = `
          <b style="font-size:14px; color:var(--red);">Hapus Kluster "${esc(cl.name)}"?</b>
          <p style="font-size:11px; color:var(--muted);">Seluruh catatan di dalam kluster ini (${count} item) juga akan ikut terhapus.</p>
          <div style="display:flex; gap:8px;">
            <button class="preset-btn" style="flex:1; padding:10px;" data-action="close-modals">Batal</button>
            <button id="exec-del-nc" class="btn-danger" style="flex:1;">Ya, Hapus</button>
          </div>
        `;
        document.getElementById('modal-generic').classList.add('open');
        document.getElementById('exec-del-nc').onclick = () => {
          state.noteClusters = state.noteClusters.filter(c => c.id !== cl.id);
          state.notes = state.notes.filter(n => n.clusterId !== cl.id);
          document.getElementById('modal-generic').classList.remove('open');
          saveState();
          showToast('Kluster dihapus');
        };
      } else if (action === 'open-add-note') {
        openNoteFormModal(actEl.dataset.cid, null);
      } else if (action === 'edit-note') {
        const nt = state.notes.find(n => n.id === actEl.dataset.nid);
        if (nt) openNoteFormModal(nt.clusterId, nt.id);
      } else if (action === 'toggle-note-done') {
        const nt = state.notes.find(n => n.id === actEl.dataset.nid);
        if (!nt) return;
        const cl = state.noteClusters.find(c => c.id === nt.clusterId);
        const linkedWallet = (cl && cl.linkedWalletId) ? state.wallets.find(w => w.id === cl.linkedWalletId) : null;

        if (!nt.isDone) {
          nt.isDone = true;
          if (linkedWallet && nt.amount > 0) {
            const txType = cl.linkedTxType || 'expense';
            const cat = cl.linkedCategory || (txType === 'income' ? 'Gaji & Uang Saku' : autoCategory(nt.title));
            const rawTitle = `[${cl.name}] ${nt.title}`;
            const finalTitle = cat === 'Lainnya' ? `Lainnya: ${rawTitle}` : rawTitle;

            const tx = {
              id: 'tx_' + Date.now(),
              walletId: linkedWallet.id,
              type: txType,
              amount: nt.amount,
              title: finalTitle,
              category: cat,
              isAuto: false,
              createdAt: new Date().toISOString()
            };
            applyWalletEffect(tx);
            state.transactions.unshift(tx);
            nt.linkedTxId = tx.id;
            saveState();
            showToast(`✓ Tercatat ke ${txType === 'income' ? 'Pemasukan' : 'Pengeluaran'} (${linkedWallet.name}): ${rp(nt.amount)}`);
            return;
          }
          saveState();
          if (linkedWallet && nt.amount <= 0) {
            showToast('Ditandai selesai (nominal Rp 0, saldo dompet tetap)');
          }
        } else {
          nt.isDone = false;
          if (nt.linkedTxId) {
            const txIdx = state.transactions.findIndex(t => t.id === nt.linkedTxId);
            if (txIdx > -1) {
              applyWalletEffect(state.transactions[txIdx], true);
              state.transactions.splice(txIdx, 1);
            }
            nt.linkedTxId = null;
            saveState();
            showToast('Centang dibatalkan — Transaksi otomatis dihapus & saldo dipulihkan');
            return;
          }
          saveState();
        }
      } else if (action === 'delete-note') {
        state.notes = state.notes.filter(n => n.id !== actEl.dataset.nid);
        saveState();
        showToast('Catatan dihapus');
      } else if (action === 'realize-note') {
        openRealizeNoteModal(actEl.dataset.nid);
      } else if (action === 'sim-notif') {
        const sim = actEl.dataset.sim;
        if (sim === 'qris') processIncomingNotification('com.gojek.app', 'GoPay', 'Pembayaran QRIS Rp18.000 di WARUNG NASI PADANG berhasil');
        if (sim === 'topup') processIncomingNotification('com.bca', 'BCA mobile', 'Transfer ke GoPay Rp100.000 berhasil');
        if (sim === 'shopee') processIncomingNotification('com.shopee.id', 'Shopee', 'Pembayaran Rp18.000 untuk Kabel Data Type-C terkonfirmasi');
        if (sim === 'unparsed') processIncomingNotification('com.bank.asing', 'Info Bank', 'Mutasi rekening berhasil diproses sistem');
      } else if (action === 'open-unparsed') {
        const box = document.getElementById('modal-generic-box');
        box.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <b style="font-size:13px; color:var(--amber);">⚠️ Notifikasi Belum Terbaca (${state.unparsedLogs.length})</b>
            <button class="act-icon" data-action="close-modals">✕</button>
          </div>
          ${state.unparsedLogs.length === 0 ? '<p style="font-size:12px; color:var(--muted); text-align:center; padding:16px 0;">Semua notifikasi terbaca rapi.</p>' :
            state.unparsedLogs.map(u => `
              <div style="background:var(--bg); padding:10px; border-radius:12px; font-size:11px;">
                <p style="margin-bottom:8px;">${esc(u.rawText)}</p>
                <button class="btn-primary" style="padding:5px 10px; font-size:11px;" data-action="dismiss-unp" data-id="${u.id}">Tandai Selesai</button>
              </div>
            `).join('')}
        `;
        document.getElementById('modal-generic').classList.add('open');
      } else if (action === 'dismiss-unp') {
        state.unparsedLogs = state.unparsedLogs.filter(u => u.id !== actEl.dataset.id);
        document.getElementById('modal-generic').classList.remove('open');
        saveState();
      } else if (action === 'export-json') {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
        a.download = 'finos-backup.json';
        a.click();
      } else if (action === 'reset-empty') {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    });

    document.body.addEventListener('change', (e) => {
      const act = e.target.dataset.action;
      if (act === 'wallet-filter') {
        walletFilter = e.target.value;
        drilldownCat = null;
        renderAll();
      } else if (act === 'history-wallet-filter') {
        historyWalletFilter = e.target.value;
        renderAll();
      } else if (act === 'chart-select-month') {
        chartSelectedMonth = parseInt(e.target.value, 10);
        drilldownCat = null;
        renderAll();
      } else if (act === 'chart-select-year') {
        chartSelectedYear = parseInt(e.target.value, 10);
        drilldownCat = null;
        renderAll();
      } else if (act === 'chart-date-start') {
        chartCustomStart = e.target.value || firstDayMonth;
        drilldownCat = null;
        renderAll();
      } else if (act === 'chart-date-end') {
        chartCustomEnd = e.target.value || todayStr;
        drilldownCat = null;
        renderAll();
      }
    });

    renderAll();
  </script>
</body>
</html>
